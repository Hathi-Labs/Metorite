# CIV-24 (D203, task 2316). The browser suite runs on a PR only when the PR
# changes workbench/control_plane (pr-check.yml). This workflow runs EVERY spec
# of the `ci` project once a night on main, so a break that no PR touched shows
# by the next morning. A red night is a red-on-main finding for lane-ci.
#
# It runs on the box runners when the switch is on: the code is already on main.
# The box has the Playwright libraries, and a step that needs root runs only on
# GitHub-hosted runners. Fence: tests/unit/test_box_runner_routing.py and
# workbench/control_plane/src/lib/e2eGate.test.ts.
name: e2e-nightly

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: "Nightly browser suite ${{ matrix.shard }}/3"
    # Main only: a dispatch from another branch gets a hosted runner.
    runs-on: ${{ (vars.USE_BOX_RUNNERS == '1' && github.repository == 'Hathi-Labs/Metorite' && github.ref == 'refs/heads/main') && 'metorite-box' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # One shard at a time: each shard starts `next dev -p 3101`, and the box
      # runners share one host network, so parallel shards would collide.
      max-parallel: 1
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: workbench/control_plane
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/control_plane/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: "Install Chromium, hosted, with the OS libraries"
        if: ${{ runner.environment == 'github-hosted' }}
        run: npx playwright install --with-deps chromium

      - name: "Install Chromium, box, libraries already there"
        if: ${{ runner.environment != 'github-hosted' }}
        run: npx playwright install chromium

      - name: Browser suite
        run: |
          npx playwright test --project=ci --shard=${{ matrix.shard }}/3 &
          pw=$!
          bash ../../scripts/e2e_watchdog.sh http://127.0.0.1:3101/chat "$pw" &
          wait "$pw"

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-report-${{ matrix.shard }}
          path: |
            workbench/control_plane/playwright-report/
            workbench/control_plane/test-results/
          retention-days: 7
