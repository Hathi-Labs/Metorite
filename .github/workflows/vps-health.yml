# External health check for the Metorite VPS.
#
# This is the OUTSIDE half of a two-layer watchdog:
#
#   1. deploy/hostinger/health-watchdog.sh runs ON the box (systemd timer) and
#      restarts anything that is down. It keeps working when the box is cut off
#      from the internet — which is exactly when CI cannot reach it.
#   2. THIS workflow probes from outside. It catches the failure the on-box
#      watchdog structurally cannot: every service healthy locally, but the box
#      unreachable from the internet. Only an external prober sees that.
#
# It opens (and auto-closes) a single GitHub issue so an outage is visible even
# when nobody is looking at the app.

name: vps-health

on:
  schedule:
    # Hourly at :17. Was daily, but a daily probe cannot answer "is it still
    # happening?" — an outage could start and clear between two checks and
    # leave no trace. Hourly builds an actual reachability record from outside
    # the network, which is the only way to prove recurrence (or its absence)
    # to Hostinger. Deliberately off the hour: shared runner capacity is
    # tightest at :00 and scheduled jobs get queued there.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "SSH in and dump firewall/network forensics"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-health
  cancel-in-progress: false

jobs:
  probe:
    name: "Probe public endpoints"
    runs-on: ubuntu-latest
    outputs:
      healthy: ${{ steps.probe.outputs.healthy }}
      report: ${{ steps.probe.outputs.report }}
    steps:
      - name: Probe gateway + workbench
        id: probe
        env:
          GATEWAY_URL: https://api.metorite.com/health
          WORKBENCH_URL: https://app.metorite.com
        run: |
          HEALTHY=1
          REPORT=""

          # Retry before declaring an outage — a single failed probe is more
          # often a transient blip than a real outage, and a flapping alert
          # that cries wolf gets ignored.
          for target in "gateway|$GATEWAY_URL" "workbench|$WORKBENCH_URL"; do
            name="${target%%|*}"
            url="${target#*|}"
            code=000
            for attempt in 1 2 3; do
              code="$(curl -s -o /dev/null -m 25 -w '%{http_code}' "$url" 2>/dev/null || echo 000)"
              # 2xx/3xx/4xx are all "alive" — a redirect to sign-in and a 401
              # both prove the stack compiled and is serving.
              #
              # 🔴 **A 5xx is NOT alive, and this line used to say it was.**
              # Measured 2026-09-01: the workbench answered HTTP 500 on EVERY
              # route, including `/`, for the whole of a deploy's build window,
              # and this probe recorded it as "OK (HTTP 500)". A completely
              # broken app passed the outage check. The rule was "any HTTP
              # response means the stack is serving", and a Next.js server with
              # no `.next` directory serves 500s perfectly.
              case "$code" in
                000|5[0-9][0-9]) ;;
                *) break ;;
              esac
              echo "  $name attempt $attempt got HTTP ${code} — retrying in 20s"
              sleep 20
            done
            # ⚠️ Alarming on 5xx is only correct BECAUSE `vps_apply.sh` no
            # longer deletes the live build before rebuilding it. While the
            # deploy routinely served 500s for minutes, this would have paged
            # on every release. The two changes ship together and the fence
            # `test_deploy_next_build_swap.py` holds both ends.
            case "$code" in
              000)
                HEALTHY=0
                REPORT="${REPORT}- **${name}**: UNREACHABLE (no response after 3 attempts) — \`${url}\`"$'\n'
                echo "::error::${name} unreachable at ${url}"
                ;;
              5[0-9][0-9])
                HEALTHY=0
                REPORT="${REPORT}- **${name}**: SERVING ERRORS (HTTP ${code}) — \`${url}\`"$'\n'
                echo "::error::${name} answers HTTP ${code} at ${url} — up, but broken for every user"
                ;;
              *)
                REPORT="${REPORT}- **${name}**: OK (HTTP ${code}) — \`${url}\`"$'\n'
                echo "${name} OK (HTTP ${code})"
                ;;
            esac
          done

          echo "healthy=${HEALTHY}" >> "$GITHUB_OUTPUT"
          {
            echo "report<<REPORT_EOF"
            printf '%s' "${REPORT}"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

  # ⚠️ THE INVERSE OF THE PROBE ABOVE. There, any HTTP answer means alive.
  # Here, an answer is the failure.
  #
  # Deliberately its own job, and it does NOT touch the outage issue. A public
  # schema and an unreachable box are different failures with different fixes,
  # and folding this into `probe` would let a config exposure read as an
  # outage — or, worse, let one mask the other. `alert` still reports
  # reachability on its own.
  exposure:
    name: "Dev-only surfaces must not exist on production"
    runs-on: ubuntu-latest
    steps:
      - name: The API schema must not be public
        env:
          BASE: https://api.metorite.com
        run: |
          # /docs, /redoc and /openapi.json exist only when ACB_ENV=dev.
          # FastAPI mounts them as plain Starlette routes with NO dependency
          # chain, so the app-level auth dependency cannot guard them —
          # `gateway/main.py` `docs_enabled` says exactly that in its own
          # docstring. Switching the env off is the ONLY guard the design has.
          #
          # It was switched on. Measured 2026-08-31: production served all
          # three, and 1121924 bytes of schema to a caller with no credential
          # (H-90). `Settings.acb_env` defaults to "dev", so an ABSENT ACB_ENV
          # is enough to do it — and nothing was watching. This job is that
          # watcher.
          FAILED=0
          for path in /openapi.json /docs /redoc; do
            code="$(curl -s -o /dev/null -m 25 -w '%{http_code}' "${BASE}${path}" 2>/dev/null || echo 000)"
            # A failed probe yields an empty or repeated code — "000000" is
            # observed, and health-watchdog.sh carries the same note. So match
            # a real 3-digit status rather than testing `!= 000`, and never
            # print OK for a request that got no answer at all.
            case "$code" in
              200)
                echo "::error::${BASE}${path} answers 200 — production is running as ACB_ENV=dev"
                FAILED=1 ;;
              [1-5][0-9][0-9])
                echo "OK      ${path} -> HTTP ${code}" ;;
              *)
                echo "        ${path} -> no answer, see the probe job" ;;
            esac
          done

          # Read the env directly too. It NAMES the cause when a path above
          # fires, and it still catches the misconfiguration if a later FastAPI
          # moves or renames those three routes.
          reported="$(curl -s -m 25 "${BASE}/version" 2>/dev/null | grep -o '"env":"[a-z]*"' || true)"
          case "$reported" in
            *'"prod"'*)
              echo "OK      /version reports prod" ;;
            "")
              # Unreadable is NOT a pass and NOT a failure here. The `probe`
              # job above owns reachability, and this job must not raise a
              # second alarm for the same outage.
              echo "::warning::/version did not answer — env unconfirmed, see the probe job" ;;
            *)
              echo "::error::/version reports ${reported} — production must report prod"
              FAILED=1 ;;
          esac

          [ "$FAILED" -eq 0 ]

  # Only runs on manual dispatch with diagnose=true. SSH is the thing that
  # breaks during these outages, so this is best-effort and never fails the run.
  diagnose:
    name: "SSH diagnostics"
    runs-on: ubuntu-latest
    needs: probe
    if: ${{ inputs.diagnose }}
    steps:
      - name: Collect on-box network + service state
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k

          # Reachability FLAPS minute to minute (observed: deploy SSH'd in at
          # 13:39, this job timed out at 13:43). One attempt proves nothing, so
          # retry across several minutes before concluding the box is cut off.
          cat > /tmp/remote.sh <<'REMOTE'
          echo "## uptime";        uptime
          echo "## units";         systemctl is-active acb.service acb-gateway acb-workbench caddy 2>&1
          echo "## enabled";       systemctl is-enabled acb.service acb-gateway acb-workbench caddy 2>&1
          echo "## watchdog timer"; systemctl status acb-health-watchdog.timer --no-pager 2>&1 | head -15
          echo "## listeners";     ss -lntp 2>/dev/null | head -25
          echo "## ufw";           sudo ufw status verbose 2>/dev/null | head -30 || echo "(no ufw)"
          echo "## iptables";      sudo iptables -S INPUT 2>/dev/null | head -40 || echo "(no iptables)"
          echo "## fail2ban";      sudo fail2ban-client status 2>/dev/null || echo "(no fail2ban)"
          echo "## sshd bans";     sudo fail2ban-client status sshd 2>/dev/null || true
          echo "## recidive bans"; sudo fail2ban-client status recidive 2>/dev/null || true
          echo "## watchdog log";  sudo tail -40 /var/log/acb/health-watchdog.log 2>/dev/null || echo "(none yet)"
          echo "## forensics";     sudo tail -80 /var/log/acb/net-forensics.log 2>/dev/null || echo "(none yet)"
          REMOTE

          for attempt in 1 2 3 4 5 6; do
            echo "───── SSH attempt ${attempt}/6 ─────"
            if timeout 120 ssh -i ~/.ssh/k \
                 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=20 -o BatchMode=yes \
                 "${SSH_USER}@${SSH_HOST}" 'bash -s' < /tmp/remote.sh; then
              echo "───── diagnostics collected on attempt ${attempt} ─────"
              exit 0
            fi
            echo "  attempt ${attempt} failed — waiting 45s"
            sleep 45
          done
          echo "SSH FAILED after 6 attempts — box unreachable from GitHub runners too"
          exit 0

  # Open one issue on outage, close it on recovery. Keeping a single issue
  # (rather than one per run) stops a multi-day outage burying the repo.
  alert:
    name: "Open / close outage issue"
    runs-on: ubuntu-latest
    needs: probe
    if: always()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEALTHY: ${{ needs.probe.outputs.healthy }}
      REPORT: ${{ needs.probe.outputs.report }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Ensure label exists
        run: |
          gh label create "vps-outage" --repo "${{ github.repository }}" \
            --description "Automated VPS health alert" --color "B60205" 2>/dev/null || true

      - name: Reconcile outage issue
        run: |
          EXISTING="$(gh issue list --repo "${{ github.repository }}" \
            --label vps-outage --state open --json number --jq '.[0].number // empty')"

          if [ "${HEALTHY}" = "1" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
                --body "Recovered — public endpoints are responding again as of $(date -u '+%Y-%m-%dT%H:%M:%SZ'). Closing."
              gh issue close "$EXISTING" --repo "${{ github.repository }}"
              echo "Closed outage issue #$EXISTING"
            else
              echo "Healthy, no open outage issue. Nothing to do."
            fi
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "The scheduled health check could not reach Metorite."
            echo
            printf '%s\n' "${REPORT}"
            echo "Checked at $(date -u '+%Y-%m-%dT%H:%M:%SZ') from a GitHub runner."
            echo
            echo "**Run:** ${RUN_URL}"
            echo
            echo "### If the box is up but unreachable"
            echo "This has happened before: the VPS stays alive (metrics keep"
            echo "reporting, outbound traffic flows) while inbound connections are"
            echo "dropped. The on-box watchdog cannot fix that — it is a network"
            echo "problem, not a service problem. Check, in order:"
            echo
            echo "1. \`/var/log/acb/net-forensics.log\` on the box — firewall and"
            echo "   listener state captured every 10 minutes, including during the outage."
            echo "2. Re-run this workflow with **diagnose = true** to pull that log out over SSH."
            echo "3. Hostinger VPS metrics — if uptime keeps climbing, the box never rebooted."
          } > "$BODY_FILE"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file "$BODY_FILE"
            echo "Commented on existing outage issue #$EXISTING"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "VPS unreachable — $(date -u '+%Y-%m-%d %H:%M UTC')" \
              --label "vps-outage" --body-file "$BODY_FILE"
          fi
          rm -f "$BODY_FILE"

      - name: Fail the run if unhealthy
        if: ${{ needs.probe.outputs.healthy != '1' }}
        run: |
          echo "::error::Metorite is unreachable — see the vps-outage issue."
          exit 1
