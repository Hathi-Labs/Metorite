# External health check for the Metorite VPS.
#
# This is the OUTSIDE half of a two-layer watchdog:
#
#   1. deploy/hostinger/health-watchdog.sh runs ON the box (systemd timer) and
#      restarts anything that is down. It keeps working when the box is cut off
#      from the internet — which is exactly when CI cannot reach it.
#   2. THIS workflow probes from outside. It catches the failure the on-box
#      watchdog structurally cannot: every service healthy locally, but the box
#      unreachable from the internet. Only an external prober sees that.
#
# It opens (and auto-closes) a single GitHub issue so an outage is visible even
# when nobody is looking at the app.

name: vps-health

on:
  schedule:
    # Hourly at :17. Was daily, but a daily probe cannot answer "is it still
    # happening?" — an outage could start and clear between two checks and
    # leave no trace. Hourly builds an actual reachability record from outside
    # the network, which is the only way to prove recurrence (or its absence)
    # to Hostinger. Deliberately off the hour: shared runner capacity is
    # tightest at :00 and scheduled jobs get queued there.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "SSH in and dump firewall/network forensics"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-health
  cancel-in-progress: false

jobs:
  probe:
    name: "Probe public endpoints"
    runs-on: ubuntu-latest
    outputs:
      healthy: ${{ steps.probe.outputs.healthy }}
      report: ${{ steps.probe.outputs.report }}
    steps:
      - name: Probe gateway + workbench
        id: probe
        env:
          GATEWAY_URL: https://api.metorite.com/health
          WORKBENCH_URL: https://app.metorite.com
        run: |
          HEALTHY=1
          REPORT=""

          # Retry before declaring an outage — a single failed probe is more
          # often a transient blip than a real outage, and a flapping alert
          # that cries wolf gets ignored.
          for target in "gateway|$GATEWAY_URL" "workbench|$WORKBENCH_URL"; do
            name="${target%%|*}"
            url="${target#*|}"
            code=000
            for attempt in 1 2 3; do
              # -m 40, not 25 (H-60): Caddy holds a request to a down
              # upstream for 30 s (lb_try_duration) before its 502. A shorter
              # bound reads that as 000, UNREACHABLE, and points at the network.
              #
              # 🔴 ONE CODE, NEVER TWO (2026-10-03). This line used to end in
              # `|| echo 000` INSIDE the `$(...)`. When the connect fails, curl
              # prints `000` through -w AND exits non-zero. So the `echo` added
              # a second `000`, and the code read `000000`. That matched no
              # alarm arm and fell through to "OK (HTTP 000000)". Production
              # HTTPS was down for hours that morning, and every hourly run
              # said HEALTHY. Fence: tests/unit/test_vps_health_probe.py.
              code="$(curl -s -o /dev/null -m 40 -w '%{http_code}' "$url" 2>/dev/null)" || true
              [ -n "$code" ] || code=000
              # An ALLOWLIST. Only 2xx/3xx/4xx are "alive" — a redirect to
              # sign-in and a 401 both prove the stack compiled and is serving.
              # Anything else retries: 000, a 5xx, or a value that is not one
              # real status.
              #
              # 🔴 **A 5xx is NOT alive, and this line used to say it was.**
              # Measured 2026-09-01: the workbench answered HTTP 500 on EVERY
              # route, including `/`, for the whole of a deploy's build window,
              # and this probe recorded it as "OK (HTTP 500)". A completely
              # broken app passed the outage check. The rule was "any HTTP
              # response means the stack is serving", and a Next.js server with
              # no `.next` directory serves 500s perfectly.
              case "$code" in
                [234][0-9][0-9]) break ;;
              esac
              echo "  $name attempt $attempt got HTTP ${code} — retrying in 20s"
              sleep 20
            done
            # ⚠️ Alarming on 5xx is only correct BECAUSE `vps_apply.sh` no
            # longer deletes the live build before rebuilding it. While the
            # deploy routinely served 500s for minutes, this would have paged
            # on every release. The two changes ship together and the fence
            # `test_deploy_next_build_swap.py` holds both ends.
            #
            # The same ALLOWLIST as the retry loop. OK is the one arm that a
            # code must EARN. The catch-all is the outage arm, so a code that
            # nobody foresaw reads as down and never as up (2026-10-03).
            case "$code" in
              [234][0-9][0-9])
                REPORT="${REPORT}- **${name}**: OK (HTTP ${code}) — \`${url}\`"$'\n'
                echo "${name} OK (HTTP ${code})"
                ;;
              5[0-9][0-9])
                HEALTHY=0
                REPORT="${REPORT}- **${name}**: SERVING ERRORS (HTTP ${code}) — \`${url}\`"$'\n'
                echo "::error::${name} answers HTTP ${code} at ${url} — up, but broken for every user"
                ;;
              *)
                HEALTHY=0
                REPORT="${REPORT}- **${name}**: UNREACHABLE (no real status after 3 attempts, curl gave ${code}) — \`${url}\`"$'\n'
                echo "::error::${name} unreachable at ${url} (curl gave ${code})"
                ;;
            esac
          done

          echo "healthy=${HEALTHY}" >> "$GITHUB_OUTPUT"
          {
            echo "report<<REPORT_EOF"
            printf '%s' "${REPORT}"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

  # ⚠️ THE INVERSE OF THE PROBE ABOVE. There, a 2xx, 3xx or 4xx answer means
  # alive. Here, an answer is the failure.
  #
  # Deliberately its own job, and it does NOT touch the outage issue. A public
  # schema and an unreachable box are different failures with different fixes,
  # and folding this into `probe` would let a config exposure read as an
  # outage — or, worse, let one mask the other. `alert` still reports
  # reachability on its own.
  exposure:
    name: "Dev-only surfaces must not exist on production"
    runs-on: ubuntu-latest
    steps:
      - name: The API schema must not be public
        env:
          BASE: https://api.metorite.com
        run: |
          # /docs, /redoc and /openapi.json exist only when ACB_ENV=dev.
          # FastAPI mounts them as plain Starlette routes with NO dependency
          # chain, so the app-level auth dependency cannot guard them —
          # `gateway/main.py` `docs_enabled` says exactly that in its own
          # docstring. Switching the env off is the ONLY guard the design has.
          #
          # It was switched on. Measured 2026-08-31: production served all
          # three, and 1121924 bytes of schema to a caller with no credential
          # (H-90). `Settings.acb_env` defaults to "dev", so an ABSENT ACB_ENV
          # is enough to do it — and nothing was watching. This job is that
          # watcher.
          FAILED=0
          for path in /openapi.json /docs /redoc; do
            # One code, never two. `|| echo 000` inside the `$(...)` made a
            # failed connect read `000000`. The same idiom made the `probe` job
            # report a dead box as HEALTHY on 2026-10-03. See the note there.
            code="$(curl -s -o /dev/null -m 25 -w '%{http_code}' "${BASE}${path}" 2>/dev/null)" || true
            [ -n "$code" ] || code=000
            # An ALLOWLIST again. Only a real 2xx/3xx/4xx proves the route
            # answered. A 000, a 5xx or a value that is not one real status
            # proves nothing, so it never prints OK. It is also not a failure
            # HERE, because the `probe` job owns reachability.
            case "$code" in
              200)
                echo "::error::${BASE}${path} answers 200 — production is running as ACB_ENV=dev"
                FAILED=1 ;;
              [234][0-9][0-9])
                echo "OK      ${path} -> HTTP ${code}" ;;
              *)
                echo "        ${path} -> HTTP ${code}, not confirmed closed, see the probe job" ;;
            esac
          done

          # Read the env directly too. It NAMES the cause when a path above
          # fires, and it still catches the misconfiguration if a later FastAPI
          # moves or renames those three routes.
          reported="$(curl -s -m 25 "${BASE}/version" 2>/dev/null | grep -o '"env":"[a-z]*"' || true)"
          case "$reported" in
            *'"prod"'*)
              echo "OK      /version reports prod" ;;
            "")
              # Unreadable is NOT a pass and NOT a failure here. The `probe`
              # job above owns reachability, and this job must not raise a
              # second alarm for the same outage.
              echo "::warning::/version did not answer — env unconfirmed, see the probe job" ;;
            *)
              echo "::error::/version reports ${reported} — production must report prod"
              FAILED=1 ;;
          esac

          [ "$FAILED" -eq 0 ]

  delivery:
    name: "The deployed commit must match main"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare the serving SHA against origin/main
        env:
          BASE: https://api.metorite.com
        run: |
          # ⚠️ EVERY OTHER JOB HERE ASKS "DOES THE MACHINERY ANSWER?".
          # None of them asks "DID DELIVERY LAND?". Those are different
          # questions, and an app running yesterday's code answers the first
          # one perfectly.
          #
          # This is the FOURTH time that gap cost real hours: H-89 (the app
          # stayed up on old code), the Operator Console drift of 2026-08-28,
          # the `.venv` ownership failure of 2026-08-26, and H-100 on
          # 2026-09-02 — a dead Console DSN killed `vps_apply.sh` ~360 lines
          # before the workbench rebuild. Each time every probe stayed green
          # and somebody found it by accident.
          #
          # `GET /version` has reported the serving SHA since 2026-08-25. The
          # deploy job gates on it. NOTHING watched it between deploys, so a
          # box that silently stopped converging looked identical to one that
          # had nothing to do.
          want="$(git rev-parse HEAD)"
          got="$(curl -s -m 25 "${BASE}/version" 2>/dev/null \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))' \
                 2>/dev/null || true)"

          if [ -z "$got" ]; then
            # Unreadable is NOT a delivery failure. The `probe` job owns
            # reachability, and two alarms for one outage teach people to
            # mute both.
            echo "::warning::/version did not answer — delivery unconfirmed, see the probe job"
            exit 0
          fi

          if [ "$got" = "$want" ]; then
            echo "OK      serving ${got:0:8}, which is origin/main"
            exit 0
          fi

          # A deploy in flight is normal, and this job runs hourly. So only
          # call it a failure once the gap has outlived any plausible deploy.
          # The deploy job's own worst case is ~105 minutes.
          if git merge-base --is-ancestor "$got" HEAD 2>/dev/null; then
            behind="$(git rev-list --count "$got..HEAD")"
            age="$(git log -1 --format=%ct HEAD)"
            now="$(date +%s)"
            hours=$(( (now - age) / 3600 ))
            echo "serving ${got:0:8}, main is ${want:0:8} (${behind} commit(s) ahead, head is ${hours}h old)"
            if [ "$hours" -ge 3 ]; then
              echo "::error::main has been ${behind} commit(s) ahead for ${hours}h — delivery is NOT landing"
              echo "         Check: ssh metorite 'systemctl show acb-pull.service -p Result'"
              echo "         A green stack proves nothing here (H-100)."
              exit 1
            fi
            echo "::notice::gap is ${hours}h — inside the deploy window, not failing yet"
            exit 0
          fi

          # The box serves a commit that is not an ancestor of main. A force
          # push, a rollback, or a box pinned to another branch. Never normal.
          echo "::error::serving ${got:0:8}, which is NOT an ancestor of main"
          exit 1

  # H-204: the box runs deploy/smoke_chat.sh itself, from acb-smoke-chat.timer,
  # every 6 hours. No path on the box raises an alert, so this job reads the
  # unit. A FAILED acb-smoke-chat.service means chat does not save (exit 1) or
  # the smoke environment is wrong (exit 2), and the run goes red. Exit 75
  # (the deploy lock was busy) is a success in the unit, so it is not red.
  #
  # systemd keeps the failed state until the next run passes. So a failure
  # while ssh from GitHub is blocked is still red on the first run that gets in.
  # An unreachable box is a warning here. The `probe` job owns reachability.
  chat-smoke-timer:
    name: "The box's chat smoke must not be failed"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci_deploy_reach.sh
            scripts/ci_ssh_host_key.sh
            deploy/hostinger/known_hosts
          sparse-checkout-cone-mode: false
      - name: Read acb-smoke-chat.service on the box
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          CONNECT_BUDGET: "180"
        run: |
          # `set +e`: a failed ssh must reach the case below.
          set +e
          set -uo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # shellcheck source=scripts/ci_deploy_reach.sh
          . scripts/ci_deploy_reach.sh
          ci_pin_host_key || exit 1

          wrc=0
          wait_for_ssh || wrc=$?
          case "$wrc" in
            0) ;;
            1) echo "::warning title=Chat smoke timer not read::ssh could not reach the box. See the probe job."
               exit 0 ;;
            *) echo "::error title=Chat smoke timer not read::ssh failed for a reason that is not the network (wait_for_ssh $wrc)."
               exit 1 ;;
          esac

          # The box prints its state. It exits 10 when the service is failed,
          # and 11 when the timer is not active.
          cat > /tmp/smoke_state.sh <<'REMOTE'
          t="$(systemctl is-active acb-smoke-chat.timer 2>/dev/null)"
          s="$(systemctl is-failed acb-smoke-chat.service 2>/dev/null)"
          echo "timer=${t:-unknown} service=${s:-unknown}"
          systemctl show acb-smoke-chat.service -p Result -p ExecMainStatus -p ExecMainExitTimestamp --no-pager 2>/dev/null
          if [ "$s" = failed ]; then
            sudo -n journalctl -u acb-smoke-chat.service -n 40 --no-pager -o short-iso 2>/dev/null
            exit 10
          fi
          [ "$t" = active ] || exit 11
          exit 0
          REMOTE
          rc=0
          timeout -k 10 120 ssh "${CI_SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' \
            < /tmp/smoke_state.sh || rc=$?
          case "$rc" in
            0)  echo "OK      acb-smoke-chat.service is not failed, and its timer is active" ;;
            10) echo "::error title=Chat does not save::acb-smoke-chat.service is FAILED on the box. Its last run exited 1 (chat does not save) or 2 (the environment is wrong). See the journal lines above."
                exit 1 ;;
            11) echo "::error title=Chat smoke timer is off::acb-smoke-chat.timer is not active on the box, so nothing proves that chat saves. Check: systemctl status acb-smoke-chat.timer"
                exit 1 ;;
            *)  echo "::warning title=Chat smoke timer not read::ssh ended with exit $rc before the state was read."
                exit 0 ;;
          esac

  # Only runs on manual dispatch with diagnose=true. SSH is the thing that
  # breaks during these outages, so this is best-effort and never fails the run.
  diagnose:
    name: "SSH diagnostics"
    runs-on: ubuntu-latest
    needs: probe
    if: ${{ inputs.diagnose }}
    steps:
      # H-200: the pinned host key and its one helper live in the repo.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci_ssh_host_key.sh
            deploy/hostinger/known_hosts
          sparse-checkout-cone-mode: false
      - name: Collect on-box network + service state
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k

          # H-200: check the box's host key against the pin, never trust any.
          # shellcheck source=scripts/ci_ssh_host_key.sh
          . scripts/ci_ssh_host_key.sh
          ci_pin_host_key || exit 1

          # Reachability FLAPS minute to minute (observed: deploy SSH'd in at
          # 13:39, this job timed out at 13:43). One attempt proves nothing, so
          # retry across several minutes before concluding the box is cut off.
          cat > /tmp/remote.sh <<'REMOTE'
          echo "## uptime";        uptime
          echo "## units";         systemctl is-active acb.service acb-gateway acb-workbench caddy 2>&1
          echo "## enabled";       systemctl is-enabled acb.service acb-gateway acb-workbench caddy 2>&1
          echo "## watchdog timer"; systemctl status acb-health-watchdog.timer --no-pager 2>&1 | head -15
          echo "## listeners";     ss -lntp 2>/dev/null | head -25
          echo "## ufw";           sudo ufw status verbose 2>/dev/null | head -30 || echo "(no ufw)"
          echo "## iptables";      sudo iptables -S INPUT 2>/dev/null | head -40 || echo "(no iptables)"
          echo "## fail2ban";      sudo fail2ban-client status 2>/dev/null || echo "(no fail2ban)"
          echo "## sshd bans";     sudo fail2ban-client status sshd 2>/dev/null || true
          echo "## recidive bans"; sudo fail2ban-client status recidive 2>/dev/null || true
          echo "## watchdog log";  sudo tail -40 /var/log/acb/health-watchdog.log 2>/dev/null || echo "(none yet)"
          echo "## forensics";     sudo tail -80 /var/log/acb/net-forensics.log 2>/dev/null || echo "(none yet)"
          REMOTE

          for attempt in 1 2 3 4 5 6; do
            echo "───── SSH attempt ${attempt}/6 ─────"
            rc=0
            timeout 120 ssh -i ~/.ssh/k -p "$SSH_PORT" "${CI_SSH_HOST_KEY_OPTS[@]}" \
                 -o ConnectTimeout=20 -o BatchMode=yes \
                 "${SSH_USER}@${SSH_HOST}" 'bash -s' < /tmp/remote.sh 2>/tmp/ssh.err || rc=$?
            cat /tmp/ssh.err >&2
            # H-200: a host key that does not match the pin is not a blip.
            # Stop at once. A retry cannot fix it and must not hide it.
            if [ "$rc" != 0 ] && ssh_host_key_fault < /tmp/ssh.err; then
              host_key_red "$(cat /tmp/ssh.err)"
              exit 1
            fi
            if [ "$rc" = 0 ]; then
              echo "───── diagnostics collected on attempt ${attempt} ─────"
              exit 0
            fi
            echo "  attempt ${attempt} failed — waiting 45s"
            sleep 45
          done
          echo "SSH FAILED after 6 attempts — box unreachable from GitHub runners too"
          exit 0

  # Open one issue on outage, close it on recovery. Keeping a single issue
  # (rather than one per run) stops a multi-day outage burying the repo.
  alert:
    name: "Open / close outage issue"
    runs-on: ubuntu-latest
    needs: probe
    if: always()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEALTHY: ${{ needs.probe.outputs.healthy }}
      REPORT: ${{ needs.probe.outputs.report }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Ensure label exists
        run: |
          gh label create "vps-outage" --repo "${{ github.repository }}" \
            --description "Automated VPS health alert" --color "B60205" 2>/dev/null || true

      - name: Reconcile outage issue
        run: |
          EXISTING="$(gh issue list --repo "${{ github.repository }}" \
            --label vps-outage --state open --json number --jq '.[0].number // empty')"

          if [ "${HEALTHY}" = "1" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
                --body "Recovered — public endpoints are responding again as of $(date -u '+%Y-%m-%dT%H:%M:%SZ'). Closing."
              gh issue close "$EXISTING" --repo "${{ github.repository }}"
              echo "Closed outage issue #$EXISTING"
            else
              echo "Healthy, no open outage issue. Nothing to do."
            fi
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "The scheduled health check could not reach Metorite."
            echo
            printf '%s\n' "${REPORT}"
            echo "Checked at $(date -u '+%Y-%m-%dT%H:%M:%SZ') from a GitHub runner."
            echo
            echo "**Run:** ${RUN_URL}"
            echo
            echo "### If the box is up but unreachable"
            echo "This has happened before: the VPS stays alive (metrics keep"
            echo "reporting, outbound traffic flows) while inbound connections are"
            echo "dropped. The on-box watchdog cannot fix that — it is a network"
            echo "problem, not a service problem. Check, in order:"
            echo
            echo "1. \`/var/log/acb/net-forensics.log\` on the box — firewall and"
            echo "   listener state captured every 10 minutes, including during the outage."
            echo "2. Re-run this workflow with **diagnose = true** to pull that log out over SSH."
            echo "3. Hostinger VPS metrics — if uptime keeps climbing, the box never rebooted."
          } > "$BODY_FILE"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file "$BODY_FILE"
            echo "Commented on existing outage issue #$EXISTING"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "VPS unreachable — $(date -u '+%Y-%m-%d %H:%M UTC')" \
              --label "vps-outage" --body-file "$BODY_FILE"
          fi
          rm -f "$BODY_FILE"

      - name: Fail the run if unhealthy
        if: ${{ needs.probe.outputs.healthy != '1' }}
        run: |
          echo "::error::Metorite is unreachable — see the vps-outage issue."
          exit 1
