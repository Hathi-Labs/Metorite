# Metorite — PR validation (lint + test only, no deploy).
#
# Runs on every PR to main.  Fast feedback loop — catches regressions
# before they land.  The full deploy workflow runs only on merge to main.

name: pr-check

on:
  pull_request:
    # Deliberately NOT restricted to `branches: [main]`. With that filter a
    # stacked PR (one targeting another feature branch) ran no checks at all,
    # and GitHub renders "no checks" the same as "nothing failing" — so broken
    # code could look green all the way up the stack. Run on every PR instead.
    #
    # ⚠️ AND DELIBERATELY NO `paths-ignore` HERE, unlike the `push` trigger
    # below. It carried `**.md` + `project-docs/**` until 2026-08-26, and that
    # is incompatible with REQUIRED status checks (H-23): when a workflow is
    # skipped by a path filter it reports NOTHING, and a required check that
    # never reports leaves the PR stuck on "Expected — waiting for status"
    # forever. Not hypothetical — the docs-only PR that carries this very commit
    # would have been the first one wedged.
    #
    # ⚠️ A SKIPPED JOB IS NOT THE SAME THING AND IS FINE: GitHub counts a job
    # skipped by `if:` as satisfied. It is the WORKFLOW never starting that
    # wedges the merge. So filter inside the workflow if you must, never at the
    # trigger.
    #
    # The cost is stated rather than hidden: a docs-only PR now runs the full
    # ~5 minute suite. That is the price of the checks meaning something at the
    # merge button, and it is cheaper than one un-mergeable PR.
  # ── Why `push` as well, when `pull_request` already covers the PR ──────────
  #
  # `pull_request` checks out `refs/pull/N/merge`, and GitHub does NOT compute
  # that ref while a PR is CONFLICTED. So a conflicted PR runs no jobs at all —
  # measured on #439, which sat `dirty` and reported `check_runs: 0`. GitHub
  # renders "no checks" identically to "nothing failing", which is the same
  # misreading the `pull_request` comment above already records once.
  #
  # That matters most for the R1 migration-prefix guard: the window in which a
  # cross-branch number collision is most likely is exactly the window in which
  # nothing was watching, and the collision then surfaces only while somebody
  # hand-resolves the conflict — i.e. while editing the very tree that hides it.
  # `test_migration_prefixes.py` DOES catch two migrations at one number (proven
  # by re-introducing a duplicate); it was simply never run.
  #
  # A `push` build has no merge ref to compute, so it runs whatever the branch
  # actually contains, conflicted or not. ⚠️ The cost is stated rather than
  # hidden: a branch with an open PR now builds twice per push. That is the
  # price of the window being closed, and it is cheaper than one silent
  # migration collision (three in two weeks — see work_plan.md §2 WS-27).
  #
  # ⚠️ THE TWO SLOW SUITES SKIP THEIR PUSH COPY: the unit shards (`test` and
  # `unit-tests`) and the browser suite (`e2e`), by `if:`. A conflicted PR
  # cannot merge, so their push copy fenced nothing and doubled the runner
  # load. The R1 migration-prefix guard moved into `lint`, which runs on push.
  # Fence: workbench/control_plane/src/lib/e2eGate.test.ts.
  push:
    # Ignore ONLY the refs that are already covered elsewhere or are machine-
    # written. Everything else — every feature branch, named or not — runs, which
    # is the point of an ignore-list over an allow-list.
    #
    #   main     — covered by deploy.yml; running here would be a third copy of
    #              the same jobs on every merge.
    #   release  — a PUBLISHED ref, not a development one: deploy.yml's
    #              `publish-release` job fast-forwards it to a SHA that has
    #              already been checked on `main` (`git push origin
    #              ${GITHUB_SHA}:refs/heads/release`). Re-checking the same tree
    #              under a second name buys nothing and doubles every deploy.
    #   staging  — the same shape, one rung down; T-7 adds the ref and the
    #              `staging-promote` fast-forward. Listed BEFORE it exists so the
    #              ref cannot arrive and quietly start duplicating every promote.
    #
    # ⚠️ Adding a name here removes a fence from that ref. Only add one that is
    # provably checked upstream of the push — that is the whole criterion.
    branches-ignore:
      - main
      - release
      - staging
    paths-ignore:
      - "**.md"
      - "project-docs/**"

permissions:
  contents: read

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      # Blocking: CORRECTNESS-ONLY gate. These rules catch real bugs, not style
      # (F821 undefined-name, F601/F602 repeated dict keys, F502+ format errors,
      # F7 syntax-level issues, B006 mutable default arg). The repo's pre-existing
      # correctness violations were fixed in the accompanying 'fix:' commit, so
      # this passes today and blocks any NEW real bug from merging.
      # NOTE: F811 (redefinition) is deliberately EXCLUDED — it has a pre-existing
      # nested-scope violation in executor.py that needs careful manual handling,
      # tracked in the ratchet plan rather than force-fixed here.
      # Rationale for report-only style: the full ruff check has ~1.3k legacy
      # STYLE findings that are NOT auto-swept — a blanket `ruff --fix` deleted
      # intentional re-exports (see the spec), so style is ratcheted down by hand.
      - name: Ruff correctness (blocking)
        run: uv run ruff check . --select F821,F601,F602,F502,F7,B006

      # plan-guard is the deterministic half of work_plan.md §6: it REFUSES
      # owner-gated actions (VPS reach, deploy, commits on main, .env edits) no
      # matter what an agent intends. It is tracked in git as of D29 precisely so
      # every checkout — cloud instance, fresh clone, worktree, headless run —
      # inherits the same refusals. This gate is what keeps that true: break the
      # guard and CI goes red, rather than the guard silently allowing
      # everything on somebody else's machine. R7 — the rule names its fence.
      - name: plan-guard owner-gate enforcement (blocking)
        run: node .claude/hooks/plan-guard.test.mjs

      # D39's fence, and it guards the same class of failure as the one above:
      # session-handoff.mjs runs at the START of every session in every
      # checkout, so a crash there is a repo nobody can open, and a parser that
      # read past `# DONE` would resurrect closed work as live work every
      # session. Both failures are silent, which is why they are tested rather
      # than trusted. R7 — the rule names its fence.
      - name: session-handoff queue injection (blocking)
        run: node .claude/hooks/session-handoff.test.mjs

      # R1. The push trigger exists for this guard: a CONFLICTED PR gets no
      # pull_request run, and that is when two branches take one migration
      # number. It lives here, not in the unit shards, because the shards skip
      # push. Fence: e2eGate.test.ts ("the migration-prefix guard runs on push").
      - name: Migration prefix guard (R1, blocking)
        run: uv run python -m pytest tests/unit/test_migration_prefixes.py -q

      # Non-blocking report: the FULL ruff check (all configured rules incl. the
      # ~1.3k-finding style backlog + C901 complexity hotspots). This is the
      # ratchet dashboard — the number should trend down; rules graduate to the
      # blocking gate above as each class is cleaned. Ratchet plan + backlog:
      # project-docs/specs/dev_velocity_tooling_2026-07.md
      - name: Ruff full report (style backlog dashboard, non-blocking)
        continue-on-error: true
        run: uv run ruff check . || echo "style backlog above (non-blocking — see ratchet plan)"

      # Blocking: hard ceiling against NEW complexity. Thresholds are
      # grandfathered to current worst-case (abs=F covers cc=223) and the
      # repo-wide average is gated at B (current avg ≈ 6.9). A PR that pushes
      # the average worse, or adds a function worse than today's worst, fails.
      - name: Xenon complexity ceiling (blocking)
        run: uv run xenon --max-absolute F --max-modules F --max-average B apps packages

      # Non-blocking initially: mypy is strict in pyproject but the full repo
      # hasn't been swept. Report now; flip to blocking per the ratchet plan.
      #
      # ⚠️ `--exclude '^apps/agents/'` is what makes this step REPORT ANYTHING.
      # Seven agents each ship a top-level `agents.py` with no `__init__.py`,
      # so mypy aborts on the duplicate-module error and stops: it checked
      # almost nothing and printed "Found 1 error". Because the step is
      # `continue-on-error`, that read as a clean report for as long as it has
      # existed. With the exclusion it checks 418 files and finds 1508 errors
      # (measured 2026-08-28) — which is the number the ratchet is against.
      - name: mypy strict (report-only)
        continue-on-error: true
        run: uv run mypy apps packages --exclude '^apps/agents/' || echo "type errors above (non-blocking — tracked)"

      # Non-blocking: per-PR codebase-health on just the changed files, so a PR
      # that adds a big/complex function is visible in review before it merges.
      # The weekly whole-repo report is a separate scheduled workflow.
      - name: Codebase health (changed files, report-only)
        continue-on-error: true
        run: uv run python scripts/codebase_health.py --diff --top 10

  # ── The unit suite, in parallel shards ───────────────────────────────────
  #
  # One serial run took 52-56 minutes (measured 2026-10-16, 27,800 tests).
  # pytest-split cuts it into contiguous chunks of equal measured time, from
  # `.test_durations`. `duration_based_chunks` keeps collection order, so
  # tests that share a module stay together. Each shard gets its own two
  # Postgres containers, so R8 suites never share a database.
  #
  # The required check "Unit tests" is the `unit-tests` job below. It fails
  # when any shard fails, and it reads every shard's report for the R8 guard.
  #
  # No `needs: lint`: lint takes a minute, and the shards are the long pole.
  #
  # Refresh the timings when the split drifts (one shard much longer than the
  # rest): download the `test-durations` artifact of a green run and commit it
  # as `.test_durations`.
  test:
    name: "Unit tests (shard ${{ matrix.shard }}/6)"
    runs-on: ubuntu-latest
    # Skips its push copy. See the note at the top of the push trigger.
    if: github.event_name != 'push'
    # `fail-fast: false`: each shard stops at its own first failure (`-x`),
    # and one run then reports the first failure of EVERY shard. Fail-fast
    # cancelled the other five and hid their failures until the next round.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # WS-31 CP-3. The Customer Console's suites are R8-gated: they skip themselves
    # unless CUSTOMER_CONSOLE_DATABASE_URL points at a real Postgres, because
    # hermetic fakes agree with whatever SQL they are handed. Independent
    # verification found this job running WITHOUT that variable, so all 53
    # DB-gated platform tests — including every CP-3 cross-tenant fence — were
    # skipping here while reporting green. A skip is not a pass, and an
    # acceptance criterion that skips in CI gates nothing at merge.
    services:
      platform-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: cc
          POSTGRES_DB: cc_platform
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # WS-31 CP-2b. A SECOND, DIFFERENT database: the TENANT one. CP-2b's
      # deployment half writes migration 159's projection plus the three
      # columns 177 adds, and those live nowhere near the Customer Console's
      # schema. `tests/unit/_tenant_ladder.py` builds it from infra/postgres/.
      #
      # ⚠️ The image is pgvector/pgvector:pg16, NOT postgres:16 — the stock
      # image cannot build this schema at all: infra/postgres/01_schema.sql
      # runs CREATE EXTENSION "uuid-ossp" AND CREATE EXTENSION vector, and
      # stock Postgres ships neither pgvector nor a vector type. The
      # `migrations` job below already names this image for exactly this file.
      tenant-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: acb
          POSTGRES_PASSWORD: acb
          POSTGRES_DB: acb_tenant
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U acb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CUSTOMER_CONSOLE_DATABASE_URL: postgresql+psycopg://cc:cc@127.0.0.1:5433/cc_platform
      # ⚠️⚠️ THIS IS NOT `DATABASE_URL`, AND THE TWO MUST NOT BE MERGED.
      # This step runs the WHOLE tests/unit/ directory. Setting DATABASE_URL
      # here would arm test_tenant_coverage.py's two DB-gated tests, which fail
      # BY CONSTRUCTION against a freshly-replayed ladder:
      #   * test_live_catalog_has_column_force_and_policy wants FORCE-RLS
      #     policies that live only in infra/postgres/generated/04_policies.sql,
      #     which the ladder deliberately never replays (that file's own header
      #     calls promoting it "a cliff", taken in a maintenance window); and
      #   * test_app_role_cannot_bypass_rls wants a non-superuser application
      #     role, and a service container's POSTGRES_USER *is* the superuser.
      # Both are WS-29 MT-1b/MT-1c's gates, not CP-2b's. They skip here today
      # and must keep skipping exactly as today. Hence a separate name that
      # nothing else in the tree reads. See customer_console.md §6(i)(2).
      TENANT_LADDER_DATABASE_URL: postgresql+psycopg://acb:acb@127.0.0.1:5434/acb_tenant
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      # Proves the variable actually reaches a live server before the suite
      # runs. Without this the job would go back to silently skipping the moment
      # the service container failed to come up — the same failure mode, one
      # layer down.
      - name: Assert the Customer Console database is reachable
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["CUSTOMER_CONSOLE_DATABASE_URL"]
          with create_engine(url).begin() as c:
              print("customer console db:", c.execute(text("select version()")).scalar_one())
          PY

      # The twin of the step above, and it needs to exist for the same reason:
      # one DSN proven reachable says NOTHING about the other, and a tenant
      # service container that failed to come up would put this job straight
      # back to silently skipping CP-2b's whole deployment half.
      #
      # It also asserts pgvector is present, because that is the specific way
      # the wrong image fails — and it fails deep inside 01_schema.sql, as a
      # migration error, rather than as "the image is wrong".
      - name: Assert the tenant ladder database is reachable and has pgvector
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["TENANT_LADDER_DATABASE_URL"]
          with create_engine(url).begin() as c:
              print("tenant ladder db:", c.execute(text("select version()")).scalar_one())
              names = [r[0] for r in c.execute(text(
                  "select name from pg_available_extensions "
                  "where name in ('vector', 'uuid-ossp')"))]
              assert "vector" in names, (
                  "no pgvector on the tenant service container — "
                  "infra/postgres/01_schema.sql cannot build. Use "
                  "pgvector/pgvector:pg16, not postgres:16.")
              print("extensions available:", sorted(names))
          PY

      # `-o junit_family=xunit1` puts the FILE on each test case, which the
      # guard in `unit-tests` reads. The report also carries the timings that
      # refresh `.test_durations`.
      - name: Run unit tests (this shard)
        run: |
          uv run python -m pytest tests/unit/ -x -v -rs \
            --splits 6 --group ${{ matrix.shard }} \
            --splitting-algorithm duration_based_chunks \
            -o junit_family=xunit1 --junitxml=junit/shard-${{ matrix.shard }}.xml

      - name: Keep this shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shard-${{ matrix.shard }}
          path: junit/
          retention-days: 7

  # ── "Unit tests": the required check, and the R8 guard ───────────────────
  #
  # Branch protection requires a check named exactly "Unit tests", so the
  # shards report under other names and this job carries the name.
  #
  # The R8 guard used to RUN about 40 files a second time, only to grep their
  # skip reasons (2 minutes). The shard reports already hold every skip
  # reason, so `scripts/ci_unit_guard.py` reads them. It fails when:
  #   * ANY test, listed or not, skipped because CUSTOMER_CONSOLE_DATABASE_URL
  #     or TENANT_LADDER_DATABASE_URL was unset (the R8 gate is disarmed),
  #   * a `--must-run` file below has no test in any report, or
  #   * a `--never-skip` file skipped a test (a database gate leaked into a
  #     fence that needs none).
  #
  # ⚠️ The `--must-run` list is HAND-MAINTAINED. Add an R8 suite in the commit
  # that creates it. Each suite's own `test_this_suite_is_named_in_the_ci_skip
  # _guard` reads this file and fails if its entry goes.
  #
  # Fence: tests/unit/test_ci_unit_guard.py.
  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    needs: test
    # `always()`, so a failed shard turns THIS check red instead of skipping
    # it. A skipped required check counts as satisfied.
    if: always() && github.event_name != 'push'
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ] || exit 1

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: junit-shard-*
          path: junit
          merge-multiple: true

      - name: The R8 suites ran, and no fence skipped
        run: |
          python3 scripts/ci_unit_guard.py check --junit junit \
            --never-skip \
              tests/unit/test_console_dependency_boundary.py \
              tests/unit/test_signin_resolve_route.py \
              tests/unit/test_seat_admin_proxy_route.py \
              tests/unit/test_billing_proxy_route.py \
            --must-run \
              tests/unit/test_customer_console_sql.py \
              tests/unit/test_customer_console_key_auth.py \
              tests/unit/test_customer_console_api.py \
              tests/unit/test_customer_console_router.py \
              tests/unit/test_customer_console_lifecycle.py \
              tests/unit/test_customer_console_resolve.py \
              tests/unit/test_customer_console_payments.py \
              tests/unit/test_customer_console_operator_list.py \
              tests/unit/test_customer_console_member_write.py \
              tests/unit/test_customer_console_seat_overview.py \
              tests/unit/test_customer_console_billing_reads.py \
              tests/unit/test_customer_console_billing_checkout.py \
              tests/unit/test_customer_console_tasks.py \
              tests/unit/test_customer_console_catalog.py \
              tests/unit/test_customer_console_decide.py \
              tests/unit/test_operator_identity.py \
              tests/unit/test_operator_session.py \
              tests/unit/test_operator_roles.py \
              tests/unit/test_operator_admin.py \
              tests/unit/test_operator_elevation.py \
              tests/unit/test_operator_activity.py \
              tests/unit/test_provider_keys.py \
              tests/unit/test_operator_signin.py \
              tests/unit/test_deployment_resolve_cache.py \
              tests/unit/test_console_dependency_boundary.py \
              tests/unit/test_signin_resolve_route.py \
              tests/unit/test_seat_admin_proxy_route.py \
              tests/unit/test_billing_proxy_route.py \
              tests/unit/test_invite_console_mirror.py \
              tests/unit/test_signup_provision_route.py \
              tests/unit/test_signup_reconciler.py \
              tests/unit/test_console_bootstrap.py \
              tests/unit/test_billing_purchase_capability.py \
              tests/unit/test_app_user_upserts.py \
              tests/unit/test_org_provisioning.py \
              tests/unit/test_org_provisioning_tenancy.py \
              tests/unit/test_owner_bootstrap.py \
              tests/unit/test_credential_tenant_threading.py \
              tests/unit/test_h3_rls_promotion_rehearsal.py \
              tests/unit/test_action_broker_tenancy_r8.py \
              tests/unit/test_org_settings_tenancy_r8.py \
              tests/unit/test_user_settings_per_org_r8.py \
              tests/unit/test_auth_me_shell_r8.py \
              tests/unit/test_h6_identity_shadow.py \
              tests/unit/test_h6_rbac_rekey.py \
              tests/unit/test_email_otp_token.py \
              tests/unit/test_invited_member_promotion.py \
              tests/unit/test_org_purge_console.py \
              tests/unit/test_org_purge_tenant.py \
              tests/unit/test_operator_door.py \
              tests/unit/test_shell_needs_r8.py \
              tests/unit/test_my_day_loop_r8.py \
              tests/unit/test_chat_session_archive_r8.py \
              tests/unit/test_projects_search_description_r8.py

      - name: Write the measured timings
        run: python3 scripts/ci_unit_guard.py durations --junit junit --out test_durations.json

      - uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: test_durations.json
          retention-days: 14

  # BO-23. The backup and restore scripts shipped on 2026-08-03 and had never
  # been executed anywhere — they reached Postgres only through
  # `docker exec acb-postgres`, which exists on one machine. The first run of an
  # untested restore should not be during an incident, and "we ran it once in
  # August" decays: a refactor to either script, or a pg_dump format change on a
  # Postgres upgrade, would break it silently and nothing would notice until it
  # mattered. So it runs here, against a real server, on every PR.
  #
  # It is a real round trip — seed, dump, DROP the table, restore, and compare
  # an md5 of the rows. The comparison is the point: every other step passes
  # against an empty database.
  backup-restore:
    name: "Backup/restore rehearsal"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # The runner's client must not be OLDER than the server: pg_dump refuses
      # to dump a newer server, which would fail the job for a reason that has
      # nothing to do with our scripts.
      - name: Install the postgresql-16 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Rehearse
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: rehearsal
        run: bash scripts/rehearse_restore.sh

      # The fence for the scratch databases of the deep verify (incident
      # 2026-10-06: 22 undropped copies filled the managed disk and the project
      # went read-only). It sweeps, drops with FORCE on a read-only server,
      # spares the decoys, and fails loudly when a drop fails. It needs this
      # job's private server, because it uses ALTER SYSTEM and the sweep drops
      # every stale `acb_verify_<digits>` database on the cluster.
      # Since 2026-10-07 both steps also need the runner's Docker: the verify
      # restores into a throwaway pgvector/pgvector:pg16 container, and scene
      # B proves that it writes nothing to this job's server.
      - name: Rehearse the scratch-database drop and sweep
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: rehearsal
        run: bash scripts/rehearse_verify_scratch.sh

  # BO-6. The ladder is 152 hand-written, hand-idempotent SQL files replayed
  # against production on every deploy, and until now nothing exercised it
  # anywhere else — a migration that only fails on a FRESH database (the state
  # a rebuilt stack or a restore lands in) was undetectable until someone hit
  # it. This replays the whole ladder from empty, then twice more, and asserts
  # the ledger makes the repeats no-ops.
  #
  # The second and third runs are the real assertion. "Idempotent" was a claim
  # about 152 files nobody had checked together; now it is a build step.
  migrations:
    name: "Migration ladder replay"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ladder
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ladder
      PG_MODE: local
      PG_USER: postgres
      PG_DB: ladder
      SKIP_PRE_MIGRATION_BACKUP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install the postgresql-16 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Seed the init schema (what initdb does on a fresh volume)
        run: |
          createdb ladder
          psql -q -d ladder -f infra/postgres/01_schema.sql

      - name: Replay the ladder, then prove the repeats are no-ops
        env:
          APP_DIR: ${{ github.workspace }}
          MIGRATIONS_DIR: ${{ github.workspace }}/infra/postgres
        run: |
          set -euo pipefail
          bash scripts/apply_migrations.sh | tail -2
          echo "--- second run ---"
          out="$(bash scripts/apply_migrations.sh)"
          echo "$out" | tail -2
          # The ledger's whole purpose: a steady-state deploy applies nothing.
          echo "$out" | grep -q "(0 applied," || {
            echo "::error::the second replay applied migrations — the ledger is not working" >&2
            exit 1
          }
          n="$(psql -tA -d ladder -c 'SELECT count(*) FROM schema_migrations')"
          echo "ledger rows: $n"
          [ "$n" -gt 100 ] || { echo "::error::ledger only recorded $n migrations" >&2; exit 1; }

      # H-25 — the Console ladder's idempotency was a CLAIM in a file header and
      # nothing checked it. It matters MORE here than for the tenant ladder
      # above: this applier keeps no ledger, so it re-applies every file on every
      # deploy. "Additive and re-runnable" is therefore not a nicety, it is the
      # only thing that makes the SECOND deploy safe. The tenant ladder earned
      # its replay job for exactly this reason.
      #
      # Reuses this job's Postgres service and psql client — a separate database
      # on the same server, because the Console's data plane is a separate
      # project (D34) and its ladder must not see tenant tables.
      - name: Replay the Customer Console ladder three times (H-25)
        run: |
          set -euo pipefail
          createdb console
          export CUSTOMER_CONSOLE_DATABASE_URL="postgresql://postgres:ladder@localhost:5432/console"
          for i in 1 2 3; do
            echo "--- console ladder run $i ---"
            bash scripts/apply_customer_console_migrations.sh | tail -1
          done
          # Every ladder file must have been applied, not merely most: the
          # applier keeps no ledger, so a file it silently skipped leaves no
          # trace anywhere for anyone to notice later.
          want="$(ls infra/customer_console/[0-9][0-9][0-9]_*.sql | wc -l)"
          bash scripts/apply_customer_console_migrations.sh | grep -q "(${want} files)" \
            || { echo "::error::the applier did not apply all ${want} infra/customer_console files" >&2; exit 1; }
          n="$(psql -tA -d console -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")"
          echo "console tables after three replays: $n"
          [ "$n" -gt 10 ] || { echo "::error::the Console ladder produced only $n tables" >&2; exit 1; }
          # 009 is CP-12's, and it is the file H-64 is about. Name it explicitly:
          # a ladder that applies but silently stops short still passes a count.
          psql -tA -d console -c "SELECT to_regclass('public.operator')" | grep -q '^operator$' \
            || { echo "::error::migration 009 did not create the operator table" >&2; exit 1; }

  # The workbench had NO CI at all: a type error or a broken pure helper only
  # surfaced when the VPS rebuilt after merge. Typecheck + vitest are seconds,
  # and they're where the frontend-side invariants live (e.g. genUiText's
  # "an agent's tree can never render [object Object]"). Not a full `next
  # build` — that stays a deploy-time step.
  frontend:
    name: "Frontend (typecheck + unit tests)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench/control_plane
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/control_plane/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

  # The operator console had tests but NO CI running them — a fence that never
  # runs is advisory by accident (R7). Same shape as the workbench job; its
  # suite carries CP-2g's purge-route ORDER pin (tenant before registry,
  # authority check first), which is the only fence on that ordering.
  frontend-operator:
    name: "Operator console (typecheck + unit tests)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench/operator_console
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/operator_console/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

  # ── H-27: the browser suite finally has a job ──────────────────────────────
  #
  # 🔴 **Nothing ran `e2e/`, and it was dead for an unknown period.** D-PM-21
  # makes a real browser the ONLY fence for UI behaviour here: `vitest.config.ts`
  # is `environment: "node"` and does not even collect a `.tsx`, and jsdom is
  # refused by decision. So every component in the control plane was unfenced,
  # and the suite that was supposed to fence it had rotted quietly — its own
  # as-builts record it green, and no job would ever have reported otherwise.
  #
  # ⚠️ **This gates a SUBSET, and the subset is named in `playwright.config.ts`.**
  # Measured 2026-09-22 on `main`: 62 passed, 33 failed, 18 fixme. The failing
  # specs are quarantined by name in the `ci` project's `testIgnore`, with the
  # count beside each one. Gating all of it would have turned `main` red on the
  # next push, and a gate that does that gets deleted rather than repaired.
  #
  # ⚠️ **It BLOCKS.** A browser check that only warns is the same thing H-27 is
  # about, in a new costume — "a fence that never runs is advisory by accident"
  # (R7, and the `frontend-operator` job above says it first). `retries: 1`
  # under CI absorbs genuine flake without hiding a real failure.
  #
  # The suite needs no gateway and no database: 12 of its specs stub `/api/**`
  # through `page.route` and the rest are pure UI. That is why this job is a
  # browser and a dev server, and nothing else.
  e2e:
    name: "Browser suite (e2e) ${{ matrix.shard }}/3"
    runs-on: ubuntu-latest
    # ── Three shards, each with its own dev server ──────────────────────────
    #
    # One worker took 17-19 minutes for 374 tests (measured 2026-10-16), and
    # it was the long pole once the unit suite was split. `workers: 1` stays:
    # each shard is one process on its own runner, as before.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # ── Why this job runs on `pull_request` only, and not on `push` ──────────
    #
    # The `push` trigger exists for ONE gap: a CONFLICTED PR gets no
    # `pull_request` run (see the trigger comment at the top). A conflicted PR
    # cannot merge either, so a browser run on its push adds no fence at the
    # merge button. The R1 migration-prefix guard runs in `lint`, which runs
    # on every push. So this job skips the push copy.
    #
    # The push copy also stopped merges. Measured 2026-10-15 over 70 runs:
    # the cap cancelled 8 of 36 push copies. A cancelled copy shows as `fail`
    # in `gh pr checks`, even when the PR's own `pull_request` run is green.
    #
    # ⚠️ A SKIP BY `if:` COUNTS AS SATISFIED, and that is the whole reason this
    # is safe. Do not move it to the trigger: a workflow that never starts
    # wedges the merge (the `pull_request` comment above records why).
    #
    # ⚠️ `!= 'push'`, NOT `== 'pull_request'`. A trigger added later still
    # runs the suite, and only the copy that duplicates a PR run goes away.
    #
    # Fence: `workbench/control_plane/src/lib/e2eGate.test.ts`.
    if: github.event_name != 'push'
    # A hung dev server must cost minutes, not the runner's six-hour default.
    #
    # 🔴 THE CAP WAS THE FAULT, NOT THE CODE. It was 20 minutes, set when the
    # suite was 32 tests in ~3 minutes. Measured 2026-10-15: 393 tests on one
    # worker take 19.0 to 19.3 minutes, and the job takes 20. Of 57 green
    # runs, 28 finished with less than one minute left. Of six cancelled logs
    # we read, five were green when the cap stopped them. #1052's own PR run
    # printed "370 passed (19.0m)", and then the cap cancelled it.
    #
    # 40 is about twice the measured job. A suite that keeps growing will
    # reach it again. Then split the suite, or raise the cap with a new count.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: workbench/control_plane
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/control_plane/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # Keyed on the lockfile, because that is what pins the Playwright version
      # and therefore the browser revision it demands.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('workbench/control_plane/package-lock.json') }}

      # Runs on a cache hit too: the download is skipped, the OS libraries are
      # not, and without them Chromium fails to launch with a missing .so.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser suite
        run: npx playwright test --project=ci --shard=${{ matrix.shard }}/3

      # ⚠️ Without this a red run is a wall of text and no screenshot, and an
      # undiagnosable gate is one somebody deletes. The report carries the
      # failure screenshot and the trace from the retry.
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            workbench/control_plane/playwright-report/
            workbench/control_plane/test-results/
          retention-days: 7

  caddy:
    name: "Caddy config (validate)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # H-60: the deploy installs deploy/hostinger/caddy/Caddyfile on the box by
    # itself. The apply validates it there and refuses a bad file, but then the
    # deploy is red AFTER the merge. This job refuses it BEFORE the merge.
    # Same version as the box (Caddy v2.11.4). Keep the tag in step with it.
    steps:
      - uses: actions/checkout@v5
      - name: caddy validate + caddy fmt (caddy:2.11.4)
        run: |
          docker run --rm -v "$PWD/deploy/hostinger/caddy:/cfg:ro" caddy:2.11.4 sh -ec '
            caddy validate --config /cfg/Caddyfile --adapter caddyfile
            caddy fmt --diff /cfg/Caddyfile > /tmp/fmt.diff || true
            if grep -qE "^[-+]" /tmp/fmt.diff; then
              echo "Caddyfile is not formatted. Run: caddy fmt --overwrite"; cat /tmp/fmt.diff; exit 1
            fi'

  secret-scan:
    name: "Secret scan"
    runs-on: ubuntu-latest
    # Report-only initially (ratchet, like mypy/ruff-full above): surfaces any
    # credential in a PR's NEW commits without blocking on an install/config
    # hiccup. Graduate to blocking once proven on a few PRs. Scans only the PR's
    # commit range, so it does NOT trip on the historical leak (BO-8) that still
    # needs a coordinated filter-repo purge — see scripts/scan_secrets_history.sh.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # `go install github.com/gitleaks/gitleaks/v8` broke: that tag's go.mod
        # still declares the module path as github.com/zricethezav/gitleaks/v8,
        # so `go install` errors on the path mismatch and the scan never ran.
        # Pull the prebuilt release binary instead — faster and path-stable.
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan PR commits for secrets
        run: |
          # `github.event.pull_request.base.sha` exists ONLY on a pull_request
          # event. Under the `push` trigger added above it expands to the empty
          # string, leaving RANGE="..HEAD" — which git reads as "from the empty
          # tree", i.e. the whole history, which is exactly the historical leak
          # (BO-8) this scan is scoped to avoid tripping on. So derive the base
          # from the merge point on a push instead.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            # fetch-depth: 0 above gives us origin/main to measure against. If
            # it is somehow absent, scan the last commit rather than the world.
            BASE="$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)"
          fi
          RANGE="${BASE}..HEAD"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--no-merges $RANGE" \
            --redact --verbose --exit-code 1
