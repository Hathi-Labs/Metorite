# Metorite — PR validation (lint + test only, no deploy).
#
# Runs on every PR to main.  Fast feedback loop — catches regressions
# before they land.  The full deploy workflow runs only on merge to main.

name: pr-check

on:
  pull_request:
    # Deliberately NOT restricted to `branches: [main]`. With that filter a
    # stacked PR (one targeting another feature branch) ran no checks at all,
    # and GitHub renders "no checks" the same as "nothing failing" — so broken
    # code could look green all the way up the stack. Run on every PR instead.
    paths-ignore:
      - "**.md"
      - "project-docs/**"

permissions:
  contents: read

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      # Blocking: CORRECTNESS-ONLY gate. These rules catch real bugs, not style
      # (F821 undefined-name, F601/F602 repeated dict keys, F502+ format errors,
      # F7 syntax-level issues, B006 mutable default arg). The repo's pre-existing
      # correctness violations were fixed in the accompanying 'fix:' commit, so
      # this passes today and blocks any NEW real bug from merging.
      # NOTE: F811 (redefinition) is deliberately EXCLUDED — it has a pre-existing
      # nested-scope violation in executor.py that needs careful manual handling,
      # tracked in the ratchet plan rather than force-fixed here.
      # Rationale for report-only style: the full ruff check has ~1.3k legacy
      # STYLE findings that are NOT auto-swept — a blanket `ruff --fix` deleted
      # intentional re-exports (see the spec), so style is ratcheted down by hand.
      - name: Ruff correctness (blocking)
        run: uv run ruff check . --select F821,F601,F602,F502,F7,B006

      # plan-guard is the deterministic half of work_plan.md §6: it REFUSES
      # owner-gated actions (VPS reach, deploy, commits on main, .env edits) no
      # matter what an agent intends. It is tracked in git as of D29 precisely so
      # every checkout — cloud instance, fresh clone, worktree, headless run —
      # inherits the same refusals. This gate is what keeps that true: break the
      # guard and CI goes red, rather than the guard silently allowing
      # everything on somebody else's machine. R7 — the rule names its fence.
      - name: plan-guard owner-gate enforcement (blocking)
        run: node .claude/hooks/plan-guard.test.mjs

      # D39's fence, and it guards the same class of failure as the one above:
      # session-handoff.mjs runs at the START of every session in every
      # checkout, so a crash there is a repo nobody can open, and a parser that
      # read past `# DONE` would resurrect closed work as live work every
      # session. Both failures are silent, which is why they are tested rather
      # than trusted. R7 — the rule names its fence.
      - name: session-handoff queue injection (blocking)
        run: node .claude/hooks/session-handoff.test.mjs

      # Non-blocking report: the FULL ruff check (all configured rules incl. the
      # ~1.3k-finding style backlog + C901 complexity hotspots). This is the
      # ratchet dashboard — the number should trend down; rules graduate to the
      # blocking gate above as each class is cleaned. Ratchet plan + backlog:
      # project-docs/specs/dev_velocity_tooling_2026-07.md
      - name: Ruff full report (style backlog dashboard, non-blocking)
        continue-on-error: true
        run: uv run ruff check . || echo "style backlog above (non-blocking — see ratchet plan)"

      # Blocking: hard ceiling against NEW complexity. Thresholds are
      # grandfathered to current worst-case (abs=F covers cc=223) and the
      # repo-wide average is gated at B (current avg ≈ 6.9). A PR that pushes
      # the average worse, or adds a function worse than today's worst, fails.
      - name: Xenon complexity ceiling (blocking)
        run: uv run xenon --max-absolute F --max-modules F --max-average B apps packages

      # Non-blocking initially: mypy is strict in pyproject but the full repo
      # hasn't been swept. Report now; flip to blocking per the ratchet plan.
      - name: mypy strict (report-only)
        continue-on-error: true
        run: uv run mypy apps packages || echo "type errors above (non-blocking — tracked)"

      # Non-blocking: per-PR codebase-health on just the changed files, so a PR
      # that adds a big/complex function is visible in review before it merges.
      # The weekly whole-repo report is a separate scheduled workflow.
      - name: Codebase health (changed files, report-only)
        continue-on-error: true
        run: uv run python scripts/codebase_health.py --diff --top 10

  test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    needs: lint
    # WS-31 CP-3. The Customer Console's suites are R8-gated: they skip themselves
    # unless CUSTOMER_CONSOLE_DATABASE_URL points at a real Postgres, because
    # hermetic fakes agree with whatever SQL they are handed. Independent
    # verification found this job running WITHOUT that variable, so all 53
    # DB-gated platform tests — including every CP-3 cross-tenant fence — were
    # skipping here while reporting green. A skip is not a pass, and an
    # acceptance criterion that skips in CI gates nothing at merge.
    services:
      platform-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: cc
          POSTGRES_DB: cc_platform
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # WS-31 CP-2b. A SECOND, DIFFERENT database: the TENANT one. CP-2b's
      # deployment half writes migration 159's projection plus the three
      # columns 177 adds, and those live nowhere near the Customer Console's
      # schema. `tests/unit/_tenant_ladder.py` builds it from infra/postgres/.
      #
      # ⚠️ The image is pgvector/pgvector:pg16, NOT postgres:16 — the stock
      # image cannot build this schema at all: infra/postgres/01_schema.sql
      # runs CREATE EXTENSION "uuid-ossp" AND CREATE EXTENSION vector, and
      # stock Postgres ships neither pgvector nor a vector type. The
      # `migrations` job below already names this image for exactly this file.
      tenant-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: acb
          POSTGRES_PASSWORD: acb
          POSTGRES_DB: acb_tenant
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U acb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CUSTOMER_CONSOLE_DATABASE_URL: postgresql+psycopg://cc:cc@127.0.0.1:5433/cc_platform
      # ⚠️⚠️ THIS IS NOT `DATABASE_URL`, AND THE TWO MUST NOT BE MERGED.
      # This step runs the WHOLE tests/unit/ directory. Setting DATABASE_URL
      # here would arm test_tenant_coverage.py's two DB-gated tests, which fail
      # BY CONSTRUCTION against a freshly-replayed ladder:
      #   * test_live_catalog_has_column_force_and_policy wants FORCE-RLS
      #     policies that live only in infra/postgres/generated/04_policies.sql,
      #     which the ladder deliberately never replays (that file's own header
      #     calls promoting it "a cliff", taken in a maintenance window); and
      #   * test_app_role_cannot_bypass_rls wants a non-superuser application
      #     role, and a service container's POSTGRES_USER *is* the superuser.
      # Both are WS-29 MT-1b/MT-1c's gates, not CP-2b's. They skip here today
      # and must keep skipping exactly as today. Hence a separate name that
      # nothing else in the tree reads. See customer_console.md §6(i)(2).
      TENANT_LADDER_DATABASE_URL: postgresql+psycopg://acb:acb@127.0.0.1:5434/acb_tenant
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      # Proves the variable actually reaches a live server before the suite
      # runs. Without this the job would go back to silently skipping the moment
      # the service container failed to come up — the same failure mode, one
      # layer down.
      - name: Assert the Customer Console database is reachable
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["CUSTOMER_CONSOLE_DATABASE_URL"]
          with create_engine(url).begin() as c:
              print("customer console db:", c.execute(text("select version()")).scalar_one())
          PY

      # The twin of the step above, and it needs to exist for the same reason:
      # one DSN proven reachable says NOTHING about the other, and a tenant
      # service container that failed to come up would put this job straight
      # back to silently skipping CP-2b's whole deployment half.
      #
      # It also asserts pgvector is present, because that is the specific way
      # the wrong image fails — and it fails deep inside 01_schema.sql, as a
      # migration error, rather than as "the image is wrong".
      - name: Assert the tenant ladder database is reachable and has pgvector
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["TENANT_LADDER_DATABASE_URL"]
          with create_engine(url).begin() as c:
              print("tenant ladder db:", c.execute(text("select version()")).scalar_one())
              names = [r[0] for r in c.execute(text(
                  "select name from pg_available_extensions "
                  "where name in ('vector', 'uuid-ossp')"))]
              assert "vector" in names, (
                  "no pgvector on the tenant service container — "
                  "infra/postgres/01_schema.sql cannot build. Use "
                  "pgvector/pgvector:pg16, not postgres:16.")
              print("extensions available:", sorted(names))
          PY

      - name: Run unit tests
        run: uv run python -m pytest tests/unit/ -x -v

      # A guard against the R8 gate quietly disarming again: if the platform
      # suites report themselves as skipped, fail the job.
      #
      # ⚠️ This list is HAND-MAINTAINED and nothing discovers it. A new R8-gated
      # Customer Console suite that is not named here still runs in the step
      # above — and still SKIPS silently there when the database variable is
      # missing, which is the exact failure this step exists to catch. Add the
      # file in the same commit that creates it (CP-2b clause 10 did).
      #
      # ⚠️ AND SO IS THE GREP LIST BELOW. Until CP-2b there was ONE grep, hard
      # -coded to the Console suites' skip string — so a suite gated on a
      # DIFFERENT variable could be added to the file list above, skip every
      # test, and leave this step green. That is the CP-3 failure class
      # reintroduced one layer up. Every gate variable named in the file list
      # needs its own line here.
      - name: Assert the R8-gated platform suites actually ran
        run: |
          uv run python -m pytest tests/unit/test_customer_console_sql.py \
            tests/unit/test_customer_console_key_auth.py tests/unit/test_customer_console_api.py \
            tests/unit/test_customer_console_router.py tests/unit/test_customer_console_lifecycle.py \
            tests/unit/test_customer_console_resolve.py \
            tests/unit/test_deployment_resolve_cache.py \
            tests/unit/test_console_dependency_boundary.py \
            -q -rs 2>&1 | tee /tmp/platform.txt
          if grep -q "CUSTOMER_CONSOLE_DATABASE_URL unset" /tmp/platform.txt; then
            echo "::error::Customer Console suites skipped — R8 gate is disarmed."
            exit 1
          fi
          # CP-2b's tenant-side suite answers to its OWN variable and would
          # skip with a wholly different message.
          if grep -q "TENANT_LADDER_DATABASE_URL unset" /tmp/platform.txt; then
            echo "::error::Deployment-resolve suite skipped — the tenant R8 gate is disarmed."
            exit 1
          fi
          # The structural fences take NO database and must never report a
          # skip at all. One that did would mean somebody folded a DB gate into
          # them, which is how §6(i)(4)'s separation quietly dies.
          if grep -q "SKIPPED.*test_console_dependency_boundary" /tmp/platform.txt; then
            echo "::error::The dependency-boundary fences skipped — they take no database and must always run."
            exit 1
          fi

  # BO-23. The backup and restore scripts shipped on 2026-08-03 and had never
  # been executed anywhere — they reached Postgres only through
  # `docker exec acb-postgres`, which exists on one machine. The first run of an
  # untested restore should not be during an incident, and "we ran it once in
  # August" decays: a refactor to either script, or a pg_dump format change on a
  # Postgres upgrade, would break it silently and nothing would notice until it
  # mattered. So it runs here, against a real server, on every PR.
  #
  # It is a real round trip — seed, dump, DROP the table, restore, and compare
  # an md5 of the rows. The comparison is the point: every other step passes
  # against an empty database.
  backup-restore:
    name: "Backup/restore rehearsal"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # The runner's client must not be OLDER than the server: pg_dump refuses
      # to dump a newer server, which would fail the job for a reason that has
      # nothing to do with our scripts.
      - name: Install the postgresql-16 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Rehearse
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: rehearsal
        run: bash scripts/rehearse_restore.sh

  # BO-6. The ladder is 152 hand-written, hand-idempotent SQL files replayed
  # against production on every deploy, and until now nothing exercised it
  # anywhere else — a migration that only fails on a FRESH database (the state
  # a rebuilt stack or a restore lands in) was undetectable until someone hit
  # it. This replays the whole ladder from empty, then twice more, and asserts
  # the ledger makes the repeats no-ops.
  #
  # The second and third runs are the real assertion. "Idempotent" was a claim
  # about 152 files nobody had checked together; now it is a build step.
  migrations:
    name: "Migration ladder replay"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ladder
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ladder
      PG_MODE: local
      PG_USER: postgres
      PG_DB: ladder
      SKIP_PRE_MIGRATION_BACKUP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install the postgresql-16 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Seed the init schema (what initdb does on a fresh volume)
        run: |
          createdb ladder
          psql -q -d ladder -f infra/postgres/01_schema.sql

      - name: Replay the ladder, then prove the repeats are no-ops
        env:
          APP_DIR: ${{ github.workspace }}
          MIGRATIONS_DIR: ${{ github.workspace }}/infra/postgres
        run: |
          set -euo pipefail
          bash scripts/apply_migrations.sh | tail -2
          echo "--- second run ---"
          out="$(bash scripts/apply_migrations.sh)"
          echo "$out" | tail -2
          # The ledger's whole purpose: a steady-state deploy applies nothing.
          echo "$out" | grep -q "(0 applied," || {
            echo "::error::the second replay applied migrations — the ledger is not working" >&2
            exit 1
          }
          n="$(psql -tA -d ladder -c 'SELECT count(*) FROM schema_migrations')"
          echo "ledger rows: $n"
          [ "$n" -gt 100 ] || { echo "::error::ledger only recorded $n migrations" >&2; exit 1; }

  # The workbench had NO CI at all: a type error or a broken pure helper only
  # surfaced when the VPS rebuilt after merge. Typecheck + vitest are seconds,
  # and they're where the frontend-side invariants live (e.g. genUiText's
  # "an agent's tree can never render [object Object]"). Not a full `next
  # build` — that stays a deploy-time step.
  frontend:
    name: "Frontend (typecheck + unit tests)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench/control_plane
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/control_plane/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

  secret-scan:
    name: "Secret scan"
    runs-on: ubuntu-latest
    # Report-only initially (ratchet, like mypy/ruff-full above): surfaces any
    # credential in a PR's NEW commits without blocking on an install/config
    # hiccup. Graduate to blocking once proven on a few PRs. Scans only the PR's
    # commit range, so it does NOT trip on the historical leak (BO-8) that still
    # needs a coordinated filter-repo purge — see scripts/scan_secrets_history.sh.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # `go install github.com/gitleaks/gitleaks/v8` broke: that tag's go.mod
        # still declares the module path as github.com/zricethezav/gitleaks/v8,
        # so `go install` errors on the path mismatch and the scan never ran.
        # Pull the prebuilt release binary instead — faster and path-stable.
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan PR commits for secrets
        run: |
          RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--no-merges $RANGE" \
            --redact --verbose --exit-code 1
