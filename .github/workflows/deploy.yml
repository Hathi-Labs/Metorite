# Metorite — CI/CD pipeline for Hostinger VPS deployment.
#
# Trigger: push to main (after PR merge) or manual dispatch.
# Flow:    lint → test → SSH to VPS → git pull → docker compose up →
#          uv sync → restart gateway → rebuild workbench → reload Caddy.
#
# Required GitHub Secrets (set in repo Settings → Secrets and variables → Actions):
#   HOSTINGER_HOST       — VPS IP or hostname (e.g. 123.45.67.89)
#   HOSTINGER_USER       — SSH user (e.g. acb)
#   HOSTINGER_SSH_KEY    — SSH private key (ed25519 or rsa)
#   HOSTINGER_APP_DIR    — app root on VPS (default /opt/acb/app)
#
# Optional:
#   LITELLM_MASTER_KEY     — for infra smoke test
#
# NOT a secret, despite what this header used to say. It claimed
# "GATEWAY_INTERNAL_TOKEN — if set, injects into .env on deploy". No such
# injection exists anywhere in this workflow or in scripts/vps_apply.sh; the
# only mechanism is vps_apply.sh READING /opt/acb/app/.env and reconciling
# workbench/control_plane/.env.local to match it. So `.env` on the box is the
# source of truth for that token, and rotating it needs no GitHub secret and no
# push-path deploy — edit .env, then run scripts/vps_pull.sh --force, or re-run
# this workflow (a rerun sends DEPLOY_FORCE=1, and so does the `force` input).
# The stale comment mattered: it sent the rotation runbook through a mechanism
# that does not exist, and that runbook's failure mode is locking out every
# signed-in member.

name: deploy

on:
  push:
    branches: [main]
    # WS-25: `paths-ignore` was REMOVED here, deliberately, and it cost a few
    # minutes of CI per docs commit to do it.
    #
    # It used to skip this whole workflow for `**.md`, `project-docs/**`,
    # `skills/**` and `workbench/e2e/**`. That was a sound optimisation while
    # delivery was push-based and documentation did not need to reach the box.
    # It is wrong now, for two reasons:
    #   1. `publish-release` lives in this workflow, and a workflow-level path
    #      filter skips the JOBS too — so a docs-only merge would never move
    #      `release`, and the box would never converge on it. Agents running ON
    #      the box read AGENTS.md and project-docs/specs; stale copies there
    #      are the exact failure this workstream exists to remove.
    #   2. It made the stranding invisible. #357 was documentation-only, so no
    #      run was ever queued for it — "no failed run" read as "nothing to do"
    #      rather than "never attempted".
    # Converging the box on main matters more than saving four minutes.
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test suite (use only for emergency hotfixes)"
        type: boolean
        default: false
      force:
        description: "Re-apply even if the box already runs this sha (for an .env edit)"
        type: boolean
        default: false
      reinstall:
        description: "Also run npm ci for the Next apps (costs ~38 s of 500 on the live app; H-60)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── Gate 1: Lint + Type Check ──────────────────────────────────────────
  lint:
    name: "Lint & type-check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      - name: Ruff lint (info-only, not blocking)
        continue-on-error: true
        run: uv run ruff check . || echo "ruff found issues (non-blocking — see log)"

      - name: Mypy (info-only, not blocking)
        continue-on-error: true
        run: uv run mypy apps packages --ignore-missing-imports || echo "mypy found issues"

  # ── Gate 2: Unit Tests ─────────────────────────────────────────────────
  test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      - name: Run unit tests
        run: uv run python -m pytest tests/unit/ -x -v

  # ── Publish the ref the VPS polls (WS-25) ──────────────────────────────
  # `scripts/vps_pull.sh` on the box applies `origin/release`, never `main`,
  # so CI gating survives the inversion to pull-based delivery: a commit whose
  # tests failed never becomes something the box will install.
  #
  # Gated on lint+test and DELIBERATELY NOT on the deploy job. That looks wrong
  # until you remember what this is for: when GitHub cannot reach the VPS, the
  # deploy job FAILS. Gating the ref on deploy success would withhold it exactly
  # when the box's own pull is the only delivery path left — which is the
  # outage this whole workstream exists to fix. What `release` asserts is "this
  # commit passed the gates and is safe to install", not "GitHub managed to
  # install it".
  #
  # The push is a plain fast-forward: git refuses a non-fast-forward rather
  # than rewriting, so a force-push to main can never silently rewind the box.
  publish-release:
    name: "Publish release ref"
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: >-
      ${{ always()
      && needs.lint.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    permissions:
      contents: write
    steps:
      # fetch-depth: 0, not the default shallow clone. `git push` proves the
      # fast-forward CLIENT-side: with depth 1 the runner does not have the
      # commit `release` currently points at, so every push after the one that
      # CREATED the ref was rejected with "fetch first" — release sat at the
      # first published commit (#360) while three merges deployed past it,
      # and the box's pull path had nothing new to converge on.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward release to this commit
        run: |
          set -euo pipefail
          echo "publishing ${GITHUB_SHA} to refs/heads/release"
          git push origin "${GITHUB_SHA}:refs/heads/release"

  # ── Gate 3: Build & Deploy to Hostinger ────────────────────────────────
  deploy:
    name: "Deploy to Hostinger"
    runs-on: ubuntu-latest
    # ── ONE DEPLOY AT A TIME — scoped to THIS JOB, never the workflow ───────
    #
    # Added 2026-08-26 after two merges three minutes apart put two deploys on
    # the same box concurrently, and CORRECTED hours later after the first cut
    # put this at workflow level and broke delivery outright.
    #
    # ⚠️ Why job level is not a detail. A workflow-level group cancels the whole
    # RUN when a newer one supersedes it while pending — including
    # `publish-release`, which fast-forwards the `release` ref that the box's
    # pull path polls. Measured: four consecutive runs cancelled with ZERO jobs
    # started, `release` frozen at 00fb8db0 while `main` moved four commits past
    # it. The serialisation meant to protect delivery had quietly stopped it.
    #
    # `lint`, `test` and `publish-release` never touch the box, so they have no
    # reason to queue behind a deploy and every reason not to: publishing the
    # ref is how a box that CANNOT be reached inbound still converges.
    #
    # ⚠️ `cancel-in-progress: false` is the load-bearing half, and it is the
    # opposite of the usual setting. Cancelling a running deploy kills SSH
    # mid-`vps_apply.sh` — the "killed mid-apply" state the 1800s timeout exists
    # to prevent, leaving migrations half-applied on a ladder that CANNOT ROLL
    # BACK (R6). A queued deploy costs minutes; a half-applied one costs a
    # restore. Note it protects the RUNNING deploy only: GitHub still cancels an
    # older PENDING run when a newer arrives, which is harmless here because
    # `vps_apply.sh` converges the box on whatever `release` says.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # A BACKSTOP, not a leash. The step's worst case is ~117 min:
    #   3 rounds x (1830 s ssh incl. the SIGKILL grace
    #               + 240 s verify wall clock + one last poll of <= 70 s)  6420 s
    #   + backoff 60 + 120                                                  180 s
    #   + the H-142 connect budget, 300 s, which one probe (45 s) and one
    #     refunded round (~45 s) can overrun                               ~400 s
    #   = ~7000 s, about 117 min, under 120.
    # ⚠️ Before H-142 `verify()` had no wall clock and a poll could take 50 s,
    # so 24 polls came to 1200 s, and the true worst case was ~160 min. The
    # 240 s deadline in verify() is what makes this sum hold. If the job
    # timeout ever fires anyway, the run is RED: a timeout fails closed.
    # Every one of those
    # numbers is deliberate — the 1800s in particular, because the pre-migration
    # backup alone takes ~11 min on the 4GB box. What this stops is the case
    # where the job hangs OUTSIDE that arithmetic and rides GitHub's 360-minute
    # default, holding the `deploy-production` concurrency slot behind it and
    # blocking every later deploy. Failing at 120 is recoverable; a wedged slot
    # for six hours is not.
    timeout-minutes: 120
    needs: [lint, test]
    # NOT `if: success()`. With skip_tests=true the `test` job is SKIPPED, and a
    # dependent guarded by success() is skipped along with it — so the emergency
    # hotfix path silently deployed nothing, exactly when it was needed most.
    # Treat a skipped test job as acceptable; a FAILED one still blocks.
    if: >-
      ${{ always()
      && needs.lint.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    env:
      # Runner-reachable public URLs used to VERIFY the deploy by outcome
      # (see the deploy step's rationale).
      GATEWAY_URL: https://api.metorite.com
      WORKBENCH_URL: https://app.metorite.com
    # `reach=unreachable` when ssh never connected from this runner (H-142).
    # The `pull-delivery` job reads it. Empty on every other path.
    outputs:
      reach: ${{ steps.deploy.outputs.reach }}
    steps:
      # ── OUTCOME-VERIFIED DEPLOY ──────────────────────────────────────────
      # Why this shape: the remote deploy script runs to "Deployment complete"
      # in ~60s, but appleboy/ssh-action intermittently reports FAILURE anyway
      # because the runner↔VPS SSH *session teardown* hits `dial tcp i/o
      # timeout` — a Hostinger network blip on connection close, NOT a failed
      # deploy (verified: both services end up live on the pushed commit). So
      # we must NOT trust the SSH action's exit code. Instead:
      #   1. run the (idempotent) deploy, ignoring its reported outcome;
      #   2. VERIFY the app is actually serving via the public health endpoint;
      #   3. only re-run the deploy if verification fails (app genuinely down),
      #      with backoff to outlast a network blip;
      #   4. the job passes iff the final verification passes.
      # This turns "SSH close flaked but deploy succeeded" (the common case)
      # into GREEN, and only fails when the app is truly unreachable.

      - uses: actions/checkout@v4
        # ⚠️ FULL history, for the ancestry test in `verify()` below.
        # The default shallow clone holds one commit, so `merge-base`
        # cannot answer whether the serving commit contains this one.
        with:
          fetch-depth: 0

      - name: Deploy + verify (up to 3 rounds)
        id: deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          # The apply skips a sha that already has a complete apply. A RERUN
          # of this job, or a dispatch with `force`, means "apply it again",
          # usually after an .env edit on the box. So both send DEPLOY_FORCE=1.
          # A forced apply still takes the deploy lock.
          DEPLOY_FORCE: ${{ (github.run_attempt > 1 || inputs.force || inputs.reinstall) && '1' || '0' }}
          # H-60: a separate switch for the dependency install. A rerun or
          # `force` keeps an unchanged node_modules, because `npm ci` under the
          # running workbench costs ~38 s of HTTP 500. `reinstall` asks for it.
          DEPLOY_REINSTALL: ${{ inputs.reinstall && '1' || '0' }}
        run: |
          set -uo pipefail

          # Materialise the deploy script + private key on the runner. A
          # keepalive-enabled ssh invocation keeps a held session alive through
          # NAT/idle culling (ServerAliveInterval) and bounds a slow handshake
          # (ConnectTimeout).
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # WS-25 D1: the apply script is a versioned FILE now, not 437 lines of
          # shell inside this YAML's env: block. One copy — shellcheckable,
          # diffable, runnable by hand during an incident — and, critically, the
          # same file scripts/vps_pull.sh executes when the box updates itself,
          # so the pushed and pulled delivery paths cannot drift apart.
          cp scripts/vps_apply.sh /tmp/deploy_remote.sh

          # H-142: the connect probe, the ssh options, the round refund and
          # the pull-path check live in this file. It sets CI_SSH_OPTS, so the
          # probe and the apply use one set of options.
          # shellcheck source=scripts/ci_deploy_reach.sh
          . scripts/ci_deploy_reach.sh
          # H-200: write the pinned known_hosts BEFORE the first ssh. With no
          # pin, stop here: StrictHostKeyChecking=yes would refuse every key.
          ci_pin_host_key || exit 1

          ssh_deploy() {
            # 1800s, matched to the pull unit's TimeoutStartSec. 900 was fatal
            # in a way verify() cannot see: the pre-migration backup alone
            # takes ~11 minutes on the 4GB box, so the session was killed
            # MID-APPLY — migrations never ran, services never restarted —
            # and verify() then blessed the still-running OLD deployment as
            # green. A timeout kill is the one failure mode where "the app is
            # healthy" says nothing about "the deploy happened".
            # `-k 30` escalates to SIGKILL after SIGTERM. Defensive: a timeout
            # that can be ignored is worse than none, because everything
            # downstream (3 rounds, the job's 120-minute backstop) is sized from
            # a bound that would not hold.
            #
            # ⚠️ It is NOT what caused run 32937837653 to sit here for 35
            # minutes, and the first version of this comment said it was. That
            # run's ssh did not hang — `ConnectTimeout=30` fired and it reported
            # "Connection timed out" on all three rounds. The runner could not
            # reach the box AT ALL: `verify()` recorded `gateway_ok=0
            # workbench=000000` for 24 polls straight while the box was serving
            # the public internet normally and `vps-health.yml` — probing from a
            # DIFFERENT runner — passed at 07:11. That is an IP-level block, and
            # the most likely cause is fail2ban reacting to the SSH storm that
            # two CONCURRENT deploys produced. See H-50.
            #
            # CI_SSH_OPTS comes from ci_deploy_reach.sh: the key, the port,
            # the host-key pin (H-200), ConnectTimeout, the ServerAlive
            # keepalive and BatchMode.
            timeout -k 30 1800 ssh "${CI_SSH_OPTS[@]}" \
              "$SSH_USER@$SSH_HOST" "DEPLOY_FORCE=${DEPLOY_FORCE:-0} DEPLOY_REINSTALL=${DEPLOY_REINSTALL:-0} bash -s" < /tmp/deploy_remote.sh
          }

          # The apply script's own last line. `vps_apply.sh` prints it and
          # nothing else does, so its PRESENCE is proof the script reached the
          # end rather than dying somewhere in the middle.
          APPLY_DONE="==> Deployment complete"

          run_deploy() {
            # The SSH exit code is ADVISORY — a flaky session teardown must not
            # be read as a failed deploy.
            #
            # 🔴 **"Advisory" used to mean IGNORED, and that is H-137.** Measured
            # 2026-09-20 on run 35513962455, and again on 35536341856 and
            # 35540481187, all marked SUCCESS: `vps_apply.sh` died at
            # `==> Rebuilding + restarting workbench` when `npm ci` hit EACCES
            # and the Next build then failed. `set -e` exited, ssh returned
            # non-zero, this function shrugged, and `verify()` passed — because
            # a failed build DELIBERATELY leaves the previous `.next` serving
            # and the gateway restart happens further up. So a healthy app on
            # the right SHA said yes to all three checks while every step after
            # the failure — the health watchdog timer, the systemd unit sync —
            # silently did not run.
            #
            # ⚠️ **`verify()` cannot see this and never could.** It asks whether
            # the app is up, public and on this commit. All three stay true when
            # the tail of the apply is skipped. Only the script can report how
            # far it got, so this reads the script's own final line.
            #
            # ⚠️ The teardown flake the old comment describes is STILL tolerated:
            # a non-zero ssh AFTER the marker is a pass.
            echo "── Running remote deploy script ──"
            : > /tmp/apply.log
            # ⚠️ PIPESTATUS, not `$?` — a pipe reports tee's status, and tee
            # always succeeds. Reading `$?` here would report every apply as
            # clean, which is the failure this block exists to end.
            ssh_deploy 2>&1 | tee /tmp/apply.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" = 0 ]; then
              echo "  ssh returned 0"
            else
              echo "  ssh exited $rc"
            fi
            if grep -qF "$APPLY_DONE" /tmp/apply.log; then
              if [ "$rc" != 0 ]; then
                echo "  ✅ the apply reached its final line — treating the"
                echo "     non-zero ssh as a session teardown flake"
              fi
              return 0
            fi
            # H-142: three failures, three messages. They are not the same
            # failure and must not read the same. Only the third one means
            # "go and look at the box".
            if ! apply_started /tmp/apply.log; then
              echo "  ❌ THE APPLY NEVER STARTED. ssh did not get a session, so"
              echo "     nothing ran on the box and nothing is half done. Last lines:"
              tail -n 5 /tmp/apply.log | sed "s/^/       /"
              return 1
            fi
            if apply_lock_busy /tmp/apply.log; then
              echo "  ⏸  NOTHING WAS APPLIED. Another deploy held the box's deploy"
              echo "     lock for the whole wait. That is usually the box's own pull"
              echo "     delivering this release. The next round checks again."
              return 1
            fi
            echo "  ❌ THE APPLY DID NOT REACH ITS FINAL LINE."
            echo "     Everything after the failure did not run. The app may"
            echo "     still be healthy on the PREVIOUS build — that is what a"
            echo "     failed Next build is designed to leave behind, and it is"
            echo "     not a deploy. Last few lines:"
            tail -n 15 /tmp/apply.log | sed "s/^/       /"
            return 1
          }

          deployed_sha() {
            # The SHA the gateway is actually running, from GET /version.
            #
            # Parsed with python3 rather than sed: the sed form needs
            # backreferences, and a literal backslash-one inside this YAML
            # inside a shell heredoc is three quoting layers deep. The first
            # cut of this line shipped a 0x01 control byte into the file and
            # broke the YAML outright. json.load also rejects a truncated or
            # HTML error body instead of silently matching nothing, which on
            # a verification step is the difference between 'wrong commit'
            # and 'no answer' — two states that must not look alike.
            #
            # 🔴 Until H-142 this line held a LITERAL backslash-n twice, from
            # the same quoting trap. Bash read each as an extra argument "n",
            # so curl also tried to fetch a host called "n". It worked by
            # accident. `json_field` in ci_deploy_reach.sh is the one parser.
            curl -fsS --max-time 10 "$GATEWAY_URL/version" 2>/dev/null | json_field sha
          }

          verify() {
            # ⚠️ THIS CHECKS **WHICH COMMIT IS SERVING**, not merely that
            # something is. Added 2026-08-26, and it closes the pipeline's
            # oldest hole: until now every gate in this workflow — this
            # function and the smoke job both — asked only "is the app up?".
            # An app that is up on YESTERDAY'S code answers yes. That is the
            # failure CLAUDE.md rule 8 records in one line ("four deploys once
            # reported success while shipping nothing"), and the reason the
            # standing instruction is to verify by the migration ledger and the
            # deployed SHA rather than by a green tick.
            #
            # It is checkable now because `GET /version` exists (WS-39,
            # 2026-08-25) and, until this change, NOTHING consumed it. A
            # verification endpoint nobody calls is a comment.
            #
            # Three conditions, all required:
            #   1. the gateway is healthy,
            #   2. the PUBLIC workbench answers — that requires Caddy, and
            #      gating on the gateway alone once let a full outage ship
            #      green,
            #   3. /version reports this commit, OR one that CONTAINS it.
            #
            # ⚠️ (3) was exact equality until 2026-09-16, and that turned
            # every pair of quick merges into a guaranteed-red run. The
            # remote script resets the box to `origin/main`, so it lands
            # main's tip AT THAT MOMENT, never the commit whose run called
            # it. Merge A then B: A's run deploys, the box ends on B, and
            # A's verify then waits 24 polls for a commit that will never
            # serve. It burns all three rounds, roughly 105 minutes, and
            # `cancel-in-progress: false` holds B's run behind it for the
            # whole time. Production was correct within two minutes in
            # every observed case.
            #
            # Equality never provided the protection, so relaxing it costs
            # nothing. An OLDER serving commit still FAILS, which is the
            # timeout-killed apply this check exists to catch. Only a
            # DESCENDANT passes, and a descendant means this run's code is
            # live.
            #
            # (3) is what makes a timeout-killed apply visible. The deploy
            # step's own comment already names that case — "a timeout kill is
            # the one failure mode where 'the app is healthy' says nothing
            # about 'the deploy happened'" — and this is the check that finally
            # says something about it.
            echo "── Verifying: gateway health + public workbench + DEPLOYED SHA ──"
            echo "   want sha: $GITHUB_SHA"
            # H-142: a WALL-CLOCK bound of 240 s. One poll is four curls of up
            # to 10 s, a git fetch and a 10 s nap, so 24 polls could take
            # 1200 s when packets drop. That broke the job's timeout
            # arithmetic, which is sized from 240 s per round.
            verify_deadline=$(( $(date +%s) + 240 ))
            for i in $(seq 1 24); do
              if [ "$i" -gt 1 ] && [ "$(date +%s)" -ge "$verify_deadline" ]; then
                echo "  ── the 240 s verify window closed at poll $i ──"
                break
              fi
              gw_ok=0
              if curl -fsS --max-time 10 "$GATEWAY_URL/health" >/dev/null 2>&1; then
                gw_ok=1
              elif curl -fsS --max-time 10 "http://$SSH_HOST:8080/health" >/dev/null 2>&1; then
                gw_ok=1
              fi
              wb_code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$WORKBENCH_URL/" 2>/dev/null || echo 000)
              got_sha=$(deployed_sha)
              sha_note=""
              sha_ok=0
              if [ -n "$got_sha" ]; then
                if [ "$got_sha" = "$GITHUB_SHA" ]; then
                  sha_ok=1
                elif timeout 20 git fetch -q --no-tags origin main 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$got_sha" 2>/dev/null; then
                  # ⚠️ SUPERSEDED, and that is a PASS. The box holds a
                  # LATER commit that CONTAINS this one, so every change
                  # this run merged is serving. See the note on verify().
                  sha_ok=1
                  sha_note=" (superseded by $got_sha, which contains it)"
                fi
              fi

              if [ "$gw_ok" = 1 ]                  && printf '%s' "$wb_code" | grep -qE '^[23]'                  && [ "$sha_ok" = 1 ]; then
                echo "  ✅ gateway healthy; workbench / -> HTTP $wb_code; serving $got_sha$sha_note (poll $i)"
                return 0
              fi
              echo "  not there yet (gateway_ok=$gw_ok workbench=$wb_code sha=${got_sha:-none}, poll $i/24) — 10s…"
              sleep 10
            done
            echo "  ── verification failed ──"
            echo "     gateway_ok=$gw_ok  workbench=$wb_code"
            echo "     serving: ${got_sha:-<no /version response>}"
            echo "     wanted:  $GITHUB_SHA"
            if [ -n "${got_sha:-}" ] && [ "$sha_ok" != 1 ]; then
              echo "     ⚠️  The app is UP but on an OLDER commit. The deploy did not"
              echo "         land — do not read the healthy app as a successful deploy."
            fi
            return 1
          }

          # H-142: this runner could not reach the box. Hand the verdict to
          # the `pull-delivery` job, which runs on a FRESH runner and accepts
          # only the served SHA and the box's deploy marker as evidence. This
          # job goes green with a warning so that the run's colour is decided
          # there. If that job cannot prove delivery, the run goes red.
          #
          # ⚠️ TWO DIFFERENT HAND-OFFS, and the text must say which. When an
          # earlier round printed `==> Taking the deploy lock`, an apply RAN
          # from this runner and then lost its session, maybe after the
          # migrations. "Nothing was applied" is then false.
          APPLY_EVER_STARTED=0
          hand_off_to_pull_path() {
            if [ "$APPLY_EVER_STARTED" = 1 ]; then
              echo "════════ this runner lost the box after an apply started ════════"
              echo "   An apply started from this runner and did not finish. The box may"
              echo "   hold a half-done apply. The pull timer re-applies it, because the"
              echo "   deploy marker was not written. ${CONNECT_SPENT}s of connect trouble since."
              note="An apply started from this runner and did not finish. The box may hold a half-done apply. The pull timer re-applies it, because the deploy marker was not written."
            else
              echo "════════ ssh never connected from this runner ════════"
              echo "   ${CONNECT_SPENT}s of connect trouble, and no apply started from here."
              note="ssh did not connect in ${CONNECT_SPENT}s. No apply started from this runner."
            fi
            echo "   Measured before H-142: 27 of 27 connects failed once a runner was"
            echo "   cut off, and a fresh runner connected seconds later."
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$GATEWAY_URL/version" 2>/dev/null) || true
            echo "   From this runner, HTTPS GET /version -> HTTP ${code:-000} (diagnostic only)."
            echo "reach=unreachable" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy runner could not reach the box::${note} The job 'Confirm delivery by the pull path' decides the run from the served SHA."
            exit 0
          }

          # ⚠️ A FORCED apply cannot be handed to the pull path. The pull
          # timer skips a sha it already applied, so the served SHA would
          # prove a delivery that happened BEFORE the .env edit this rerun
          # exists for. That would be a false green.
          no_connect() {
            if [ "${DEPLOY_FORCE:-0}" = "1" ]; then
              echo "❌ Deploy FAILED: ssh never connected, and this run asked for a FORCED apply"
              echo "   (a rerun, or the force or reinstall input). The pull path does not"
              echo "   re-apply a sha it already has, so it cannot stand in. Re-run this job."
              exit 1
            fi
            hand_off_to_pull_path
          }

          # ⚠️ A CONNECT FAILURE NEVER SPENDS A ROUND (H-142). `wait_for_ssh`
          # probes with backoff before every round, and the probes share ONE
          # budget, CONNECT_BUDGET, for the whole job. A round whose ssh then
          # dropped before the apply printed its first line is refunded, and
          # charged to that budget instead, so this loop always ends.
          round=0
          while [ "$round" -lt 3 ]; do
            wrc=0
            wait_for_ssh || wrc=$?
            # H-200: a host key that does not match the pin. wait_for_ssh
            # already printed why. Red at once: no retry and no hand-off.
            if [ "$wrc" = 4 ]; then
              echo "❌ Deploy FAILED: the box's ssh host key did not verify."
              exit 1
            fi
            if [ "$wrc" = 2 ]; then
              echo "❌ Deploy FAILED: ssh fails for a reason that is not the network."
              exit 1
            fi
            [ "$wrc" = 1 ] && no_connect
            round=$((round + 1))
            echo "════════ Deploy round $round/3 ════════"
            # ⚠️ BOTH, and in this order. The apply must have finished AND the
            # right commit must be serving. Either alone has shipped a green
            # run that delivered nothing — `verify()` alone is H-137, and a
            # finished apply alone was the hole `verify()` was added to close.
            applied=0
            t0=$(date +%s)
            if run_deploy; then applied=1; fi
            if apply_started /tmp/apply.log; then APPLY_EVER_STARTED=1; fi
            if [ "$applied" = 1 ] && verify; then
              echo "✅ Deploy verified healthy on round $round."
              exit 0
            fi
            # H-200: the probe passed, and then the apply's ssh met another
            # host key. That is never a blip, so it gets no refund.
            if [ "$applied" != 1 ] && ! apply_started /tmp/apply.log \
               && ssh_host_key_fault < /tmp/apply.log; then
              host_key_red "$(tail -n 8 /tmp/apply.log)"
              echo "❌ Deploy FAILED: the box's ssh host key did not verify."
              exit 1
            fi
            if [ "$applied" != 1 ] && ! apply_started /tmp/apply.log \
               && ssh_network_fault < /tmp/apply.log; then
              charge_connect $(( $(date +%s) - t0 ))
              round=$((round - 1))
              echo "↩  Not counted as a round: the connection dropped before the apply started."
              connect_budget_left || no_connect
              continue
            fi
            if [ "$applied" != 1 ]; then
              echo "⚠️  The apply script did not finish on round $round."
            else
              echo "⚠️  App not healthy after round $round."
            fi
            if [ "$round" -lt 3 ]; then
              backoff=$((round * 60))
              echo "Backing off ${backoff}s before the next round…"
              sleep "$backoff"
            fi
          done

          echo "❌ Deploy FAILED after 3 rounds — the apply did not finish, or"
          echo "   the app is not serving this commit."
          echo "   Diagnose: SSH to the box and check 'systemctl status acb-gateway acb-workbench'"
          echo "   and 'docker compose -f infra/docker-compose.yml logs --tail=100'."
          exit 1

  # ── H-142: the runner could not reach the box. Did the box deliver? ─────
  #
  # Runs ONLY when `deploy` handed off (`reach=unreachable`), and on a FRESH
  # runner on purpose. Measured before this job existed: once a runner was
  # cut off, 27 of 27 of its connects failed, and a different runner connected
  # 10 s after the last one. So a new runner has the best chance to reach the
  # box over HTTPS, and the old one has the worst.
  #
  # ⚠️ RULE 8. This job is green ONLY on served evidence, read over HTTPS:
  # `/version` `sha` (the gateway's checkout) AND `applied_sha` (the box's
  # deploy marker, written at the apply's last line, after the web build)
  # both equal or contain this commit, and the public workbench answers.
  # `await_pull_delivery` in scripts/ci_deploy_reach.sh says what that proves
  # and what it does not.
  #
  # Green WITH a warning annotation, not a plain green. The release is live,
  # and that is what this workflow asserts. The warning keeps the broken push
  # path visible on the run page, because a push path that stays broken for
  # days looked exactly like this before (WS-25, 2026-08-05).
  pull-delivery:
    name: "Confirm delivery by the pull path"
    runs-on: ubuntu-latest
    needs: deploy
    # ⚠️ `always()` is load-bearing. Without it GitHub adds `success()`, and
    # `success()` is FALSE when any ancestor was SKIPPED. A `skip_tests`
    # dispatch skips `test`, so this job would be skipped too, and a deploy
    # that handed off would end the run GREEN with no evidence. The `deploy`
    # job's own `if:` records the same trap.
    if: >-
      ${{ always()
      && needs.deploy.result == 'success'
      && needs.deploy.outputs.reach == 'unreachable' }}
    # PULL_WAIT (1500 s, wall clock) plus one last read (<= 40 s), the 10 s
    # port probe and the checkout. 1500 s, not 900: the pull timer ticks
    # every 5 min, and a pull apply that runs the pre-migration backup
    # (~11 min) and a web build can finish more than 15 min after the tick.
    timeout-minutes: 30
    env:
      GATEWAY_URL: https://api.metorite.com
      WORKBENCH_URL: https://app.metorite.com
    steps:
      # FULL history, for the ancestry test in `commit_contains`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the box to serve this commit
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          set -uo pipefail
          # shellcheck source=scripts/ci_deploy_reach.sh
          . scripts/ci_deploy_reach.sh

          # Diagnostic only, and it decides nothing: can THIS runner open the
          # ssh port? The next blip then says whether the fault followed the
          # runner. No key is needed to open a TCP socket.
          # shellcheck disable=SC2016  # $1 and $2 expand in the inner bash
          if timeout 10 bash -c 'exec 3<>"/dev/tcp/$1/$2"' _ "$SSH_HOST" "$SSH_PORT" 2>/dev/null; then
            echo "From this runner, the ssh port OPENS (diagnostic only)."
          else
            echo "From this runner, the ssh port does NOT open (diagnostic only)."
          fi

          rc=0
          await_pull_delivery "$GITHUB_SHA" || rc=$?
          case "$rc" in
            0)
              # ⚠️ It names no path. A push apply from round 1 can finish
              # before the runner loses the box, and the marker cannot tell
              # which path wrote it. The served SHA is the evidence.
              echo "::warning title=Delivered, confirmed by the served SHA::The deploy runner lost ssh to the box. The box serves ${GITHUB_SHA:0:12} with a complete apply behind it, proved by /version sha and applied_sha. The push path failed on this run."
              echo "### Delivered, confirmed by the served SHA (H-142)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "The deploy runner lost ssh to the box. The box serves \`${GITHUB_SHA:0:12}\` with a complete apply behind it." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 0
              ;;
            3)
              echo "❌ NOT DELIVERED, AND NO EVIDENCE EITHER WAY. The deploy runner could"
              echo "   not reach the box over ssh, and this runner got no answer from"
              echo "   $GATEWAY_URL/version for ${PULL_WAIT}s. Check the box from elsewhere:"
              echo "   curl $GATEWAY_URL/version, then re-run the workflow."
              echo "::error title=Box unreachable from GitHub::No ssh from the deploy runner and no /version from this one. Delivery is unproven."
              exit 1
              ;;
            *)
              echo "❌ NOT DELIVERED. The deploy runner could not reach the box over ssh,"
              echo "   and the box did not deliver ${GITHUB_SHA:0:12} by itself within ${PULL_WAIT}s."
              echo "   Check the pull path on the box: systemctl status acb-pull.service,"
              echo "   and journalctl -u acb-pull for 'apply FAILED' or the give-up line."
              echo "::error title=Not delivered::The runner could not reach the box, and the box did not self-deliver ${GITHUB_SHA:0:12}."
              exit 1
              ;;
          esac

  # ── WS-27bm S16: every deploy proves that chat saves ────────────────────
  #
  # For two months every chat save on production failed and every deploy went
  # green (spec projects_ai_chat.md §21). `verify()` asks whether the app is up
  # on this commit. This job asks whether a chat message SAVES and READS BACK.
  #
  # It runs after the deploy is verified, on either path: the push apply, or
  # the pull path that `pull-delivery` confirmed. `deploy/smoke_chat.sh` runs
  # on the box as the ssh user, mints a 900 s session in memory and runs
  # `scripts/smoke_chat_persist.py`. No cookie file and no GitHub secret.
  #
  # ⚠️ RED ON PURPOSE, and no rollback. R6 says we only roll forward. A red
  # here means "the release is live and chat does not save". Fix forward.
  # Exit 1 (a step failed) and exit 2 (the environment is wrong) are both red
  # at once, with no retry. Only an ssh blip retries, as H-142 does it.
  #
  # ⚠️ ONLY A SMOKE THAT RAN AND FAILED IS RED. When ssh cannot reach the box
  # for the whole connect budget, or drops on all 3 attempts, the smoke has no
  # verdict. The job is then green with a warning, which is H-142's contract
  # for the pull path: `pull-delivery` proved the SHA by HTTPS, and the runner
  # that cannot reach the box must not turn that into a red.
  #
  # ⚠️ No concurrency group here. The `deploy-production` group covers only
  # the `deploy` job. The smoke holds a SHARED lock on the box's deploy lock
  # instead, which every apply takes EXCLUSIVE, on both delivery paths. Exit 75
  # means another deploy held it for the whole wait. That is a warning.
  chat-smoke:
    name: "Chat saves (smoke)"
    runs-on: ubuntu-latest
    needs: [deploy, pull-delivery]
    # `always()`, for the reason the `pull-delivery` job records. A skipped
    # `pull-delivery` is the NORMAL case, when the push path reached the box.
    if: >-
      ${{ always()
      && needs.deploy.result == 'success'
      && (needs.pull-delivery.result == 'success' || needs.pull-delivery.result == 'skipped') }}
    # A BACKSTOP, sized from the parts. deploy/smoke_chat.sh bounds itself at
    # 935 s (its header gives the sum), so one ssh gets 990 s + 10 s grace.
    #   3 attempts, each dropped just before its timeout      3 x 1000   3000 s
    #   the H-142 connect budget, and one probe past it       300 + 90    390 s
    #   the naps between attempts                             20 + 40      60 s
    #   = 3450 s, about 58 min, under 60.
    # A timeout of one ssh never retries (below), so a real run is far shorter.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Save one chat message on the box and read it back
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          # ⚠️ `set +e`. GitHub runs this step under `bash -e`, and a failed
          # ssh pipe would end the step before the case below reads its code.
          set +e
          set -uo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # shellcheck source=scripts/ci_deploy_reach.sh
          . scripts/ci_deploy_reach.sh
          ci_pin_host_key || exit 1

          # The smoke prints this line only when all four steps passed.
          SMOKE_DONE="PASS chat persistence on"
          # The script's own bound is 935 s. This is a little more, so the
          # script always reports first.
          SMOKE_SSH_TIMEOUT=990

          # The smoke did not run to an answer. Green with a warning: only a
          # smoke that RAN and failed is red.
          no_verdict() {
            echo "⚠️  Chat smoke did not run: $1."
            echo "::warning title=Chat smoke did not run::$1. Chat was not checked on this run. Run deploy/smoke_chat.sh on the box by hand."
            exit 0
          }
          for attempt in 1 2 3; do
            wrc=0
            wait_for_ssh || wrc=$?
            if [ "$wrc" = 4 ]; then
              echo "❌ Chat smoke FAILED: the box's ssh host key did not verify."
              exit 1
            fi
            # H-142: the connect budget ran out on network faults. The smoke did
            # not RUN, so it has no verdict. `pull-delivery` already proved the
            # SHA by HTTPS, and H-142's contract for that case is green with a
            # warning. A red here would reverse it.
            if [ "$wrc" = 1 ]; then
              no_verdict "ssh did not reach the box in ${CONNECT_SPENT}s of connect budget"
            fi
            if [ "$wrc" != 0 ]; then
              echo "❌ Chat smoke FAILED: ssh fails for a reason that is not the network (exit $wrc)."
              exit 1
            fi
            echo "── Chat smoke, attempt $attempt/3 ──"
            : > /tmp/smoke.log
            timeout -k 10 "$SMOKE_SSH_TIMEOUT" ssh "${CI_SSH_OPTS[@]}" \
              "$SSH_USER@$SSH_HOST" "bash -s" < deploy/smoke_chat.sh 2>&1 | tee /tmp/smoke.log
            rc=${PIPESTATUS[0]}
            # A teardown flake after the smoke passed is still a pass.
            if grep -qF "$SMOKE_DONE" /tmp/smoke.log; then
              echo "✅ Chat saves on production."
              exit 0
            fi
            # ⚠️ A STEP FAILED, and then ssh dropped. The log holds the smoke's
            # own lines too, so a drop after a FAIL line must not read as a
            # blip. Red at once, before the retry and the no-verdict tests.
            if grep -q '^FAIL ' /tmp/smoke.log; then
              echo "❌ Chat smoke FAILED: a step failed before ssh dropped (exit $rc). Chat does not save on production."
              echo "   The release is live. Fix forward (R6). Read the step line above."
              exit 1
            fi
            case "$rc" in
              1)
                echo "❌ Chat smoke FAILED: a step failed. Chat does not save on production."
                echo "   The release is live. Fix forward (R6). Read the step line above."
                exit 1 ;;
              2)
                echo "❌ Chat smoke FAILED: the environment is wrong (exit 2). See the line above."
                exit 1 ;;
              75)
                # BUSY. A later deploy held the box's deploy lock for the whole
                # wait, so the smoke checked nothing. That deploy runs its own
                # chat-smoke. A red here would blame this release for nothing.
                echo "::warning title=Chat smoke did not run::Another deploy held the box's deploy lock, so chat was not checked on this run. The later deploy's own chat-smoke checks it."
                exit 0 ;;
              0)
                # The script exits 0 only after the smoke printed PASS.
                echo "❌ Chat smoke FAILED: exit 0 with no PASS line. The smoke did not prove a save."
                exit 1 ;;
              124|137)
                # ⏱ A TIMEOUT, not a drop. The script bounds itself at 935 s,
                # so the session stalled and nobody knows how far the smoke
                # got. No retry: it could run beside the first one.
                no_verdict "the smoke did not report in ${SMOKE_SSH_TIMEOUT}s (timeout, exit $rc)" ;;
            esac
            # Any other code is ssh's own (255). Retry only when ssh names a
            # network fault, the same test the deploy job uses.
            if ! ssh_network_fault < /tmp/smoke.log; then
              echo "❌ Chat smoke FAILED: exit $rc, and it is not a network blip."
              exit 1
            fi
            echo "↩  ssh dropped (exit $rc). Trying again."
            sleep $((attempt * 20))
          done
          no_verdict "ssh dropped on all 3 attempts"

  # ── Post-deploy: Smoke test (hit /health endpoint) ─────────────────────
  smoke:
    name: "Smoke test"
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Health check
        # Informational only. The deploy job already gates on the gateway,
        # workbench and infra being healthy *on the box* before it completes;
        # this probe hits the PUBLIC URL, which can be transiently unreachable
        # for minutes while the concurrent Next.js rebuild saturates the 4GB
        # VPS. A flap here must not mark an otherwise-successful deploy failed.
        #
        # ⚠️ It reports the SERVING SHA alongside the health result — and only
        # reports it. The gate is `verify()` in the deploy job, which now fails
        # on a SHA mismatch; duplicating that gate here would mean two places
        # deciding the same thing, and `continue-on-error: true` makes this one
        # unable to decide anything anyway. What it is for is the transcript: an
        # operator reading a past run should be able to see WHICH COMMIT was
        # answering, without SSH access and without the box still being in that
        # state.
        continue-on-error: true
        run: |
          GATEWAY_URL="${GATEWAY_URL:-https://api.metorite.com}"
          echo "Hitting $GATEWAY_URL/health (with retries for cold start)..."
          # The 4GB VPS is still under heavy load right after deploy (the
          # Next.js rebuild pegs CPU/RAM), so the gateway can take a couple of
          # minutes to answer. Retry for up to ~5min before calling it a failure
          # so a slow warm-up doesn't masquerade as a broken deploy.
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$GATEWAY_URL/health"; then
              echo ""
              echo "Gateway is healthy (attempt $attempt)"
              serving=$(curl -fsS --max-time 10 "$GATEWAY_URL/version" 2>/dev/null                 | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))'                 2>/dev/null)
              echo "Serving commit: ${serving:-<no /version response>}"
              echo "This run's commit: $GITHUB_SHA"
              exit 0
            fi
            echo "attempt $attempt/30 failed — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 30 attempts (~5min)"
          exit 1
