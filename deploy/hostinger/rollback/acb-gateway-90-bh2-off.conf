# WS-49 BH-2 — the rollback of the gateway sandbox.
# Spec: project-docs/specs/box_hardening.md §5 BH-2 item 6.
#
# Nothing installs this file in a deploy. The BH-7 drop-in installer reads
# deploy/hostinger/*.service.d/*.conf only, and this directory is not one.
# One command installs it, and writes the 72-hour expiry beside it:
#
#   sudo bash /opt/acb/app/scripts/bh2_rollback.sh on
#
# It lands as /etc/systemd/system/acb-gateway.service.d/90-bh2-off.conf.
# 90 sorts after 50-hardening.conf, so each line below wins over that file.
# An empty assignment resets the list that the drop-ins before it built.
#
# The first six lines can each stop the start. BH-F3
# (tests/unit/test_unit_hardening.py) fails if one goes.
# The lines after them reset each other sandbox line of 50-hardening.conf to
# the systemd default, so the rollback gives the unit of today.
#
# Deliberately NOT here: ExecStart= and Environment=. They are not sandbox
# lines. If the venv ExecStart of 50-hardening.conf is the fault, revert the
# PR instead.

[Service]
ReadWritePaths=
InaccessiblePaths=
ProtectSystem=no
ProtectHome=no
NoNewPrivileges=no
PrivateTmp=no
ProtectProc=default
RestrictSUIDSGID=no
# "~" with an empty list is "every capability", the systemd default.
CapabilityBoundingSet=~
AmbientCapabilities=
LockPersonality=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectControlGroups=no
ProtectClock=no
ProtectHostname=no
RestrictRealtime=no
