# WS-49 BH-2 — the systemd sandbox of the gateway.
# Spec: project-docs/specs/box_hardening.md §5 BH-2 item 2.
#
# A prompt injection can steer an agent, and the Copilot CLI shell runs as a
# child of this unit. This file stops that child from becoming root: no sudo
# (NoNewPrivileges), no Docker socket, no user systemd manager (/run/user),
# and no write to a file that a root unit or a deploy runs later.
#
# ExecStart runs the venv binary, not `uv run`, because `uv run` syncs the
# venv and the gateway must not write the venv. It keeps the drain flag of the
# base unit (--timeout-graceful-shutdown 5). The empty ExecStart= drops the
# base line. Fence: tests/unit/test_gateway_drain.py reads the EFFECTIVE
# ExecStart across the base unit and its drop-ins.
#
# ReadWritePaths is the measured write list of the gateway, and nothing more
# (spec §2.1 and the BH-2 write list). .venv, /opt/acb/t2-vendor and
# infra/enabled_models.json are NOT on it. A file on it must exist before the
# start, so scripts/vps_apply.sh creates each one before the gateway restart
# (ensure_gateway_rw_paths). It also makes the home dirs of the "-" entries,
# so they bind on a fresh box.
#
# MEM0_DIR moves the mem0 home out of ~/.mem0. mem0 runs os.makedirs on it at
# import, and ProtectHome=read-only refuses a new dir under /home/acb.
# StateDirectory=acb-gateway (40-agent-site.conf) makes /var/lib/acb-gateway.
#
# npm_config_cache moves the npm cache out of ~/.npm, which is read-only here.
# An agent child gets the same value from acb_common.child_env
# (AGENT_PATH_VALUES). CacheDirectory=acb-gateway makes /var/cache/acb-gateway.
#
# A writer of /opt/acb/app/.env must keep its inode. This file binds the inode
# that .env has at start, so a rename leaves the gateway on a dead copy.
# Fence: tests/unit/test_env_inode.py.
#
# Do NOT set PYTHONPATH here (40-agent-site.conf says why).
#
# Rollback, one command, for 72 hours:
#   sudo bash /opt/acb/app/scripts/bh2_rollback.sh on
# It installs 90-bh2-off.conf, which sorts after this file and resets it.
#
# scripts/vps_apply.sh installs this file before the gateway restart, and its
# strict check fails the deploy when NoNewPrivileges or ProtectSystem is off.
# Fences: tests/unit/test_unit_hardening.py (BH-F3 part 2) and
# tests/unit/test_bh2_strict_check.py.

[Service]
ExecStart=
ExecStart=/opt/acb/app/.venv/bin/uvicorn gateway.main:app --host 0.0.0.0 --port 8080 --timeout-graceful-shutdown 5
Environment=PATH=/opt/acb/app/.venv/bin:/home/acb/.local/bin:/usr/local/bin:/usr/bin:/bin
Environment=VIRTUAL_ENV=/opt/acb/app/.venv
Environment=MEM0_DIR=/var/lib/acb-gateway/mem0
Environment=npm_config_cache=/var/cache/acb-gateway/npm
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ReadWritePaths=/opt/acb/app/.env /opt/acb/app/data
ReadWritePaths=/opt/acb/app/infra/provider_models_cache.json
ReadWritePaths=/opt/acb/app/apps/services/gateway/agents.json
ProtectHome=read-only
ReadWritePaths=-/home/acb/.acb -/home/acb/.copilot -/home/acb/.cache/copilot -/home/acb/.cache/github-copilot-sdk
InaccessiblePaths=-/run/user -/run/docker.sock -/var/run/docker.sock -/etc/acb -/etc/sudoers.d
ProtectProc=invisible
RestrictSUIDSGID=yes
CapabilityBoundingSet=
AmbientCapabilities=
LockPersonality=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
