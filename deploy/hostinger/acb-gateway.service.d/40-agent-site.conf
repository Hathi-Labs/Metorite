# WS-49 BH-7 — the dirs of the gateway's own, outside the shared venv.
# Spec: project-docs/specs/box_hardening.md §5 BH-7 (Q3c).
#
# StateDirectory makes /var/lib/acb-gateway, owned by User=acb. Agent installs
# go to /var/lib/acb-gateway/agent-site (acb_skills/agent_site.py), never to
# /opt/acb/app/.venv. CacheDirectory makes /var/cache/acb-gateway. It holds the
# uv cache and the constraints file that each agent install passes with -c.
#
# CUSTOM_APPS_T2_VENDOR_DIR is the T2 vendor cache that the deploy installs
# with --ignore-scripts. The deploy strips that name from .env, because an
# EnvironmentFile line wins over this Environment line.
#
# Do NOT set PYTHONPATH here. A unit-wide value goes BEFORE the venv on
# sys.path in the gateway too. A child gets it by value from
# acb_common.child_env.AGENT_PATH_VALUES.
#
# scripts/vps_apply.sh installs this file before the first service restart.
# Fences: tests/unit/test_unit_hardening.py (BH-F3) and
# tests/unit/test_agent_deps_target.py (BH-F6).

[Service]
StateDirectory=acb-gateway
CacheDirectory=acb-gateway
Environment=UV_CACHE_DIR=/var/cache/acb-gateway/uv
Environment=CUSTOM_APPS_T2_VENDOR_DIR=/opt/acb/t2-vendor
