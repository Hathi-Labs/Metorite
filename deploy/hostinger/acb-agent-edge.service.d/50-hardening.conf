# WS-55 EA-10a — the systemd sandbox of the agent edge.
# Spec: project-docs/specs/external_agent_access.md §15.3 and §10.1 (other
# control 2). The shape is the BH-2 sandbox of acb-gateway
# (box_hardening.md §5 BH-2).
#
# The edge is a public door, and it holds the database DSN and the signing
# key. This file keeps a hostile request that reaches code execution in the
# edge away from every other secret on the box:
#
# - InaccessiblePaths hides the root /opt/acb/app/.env. It holds
#   GATEWAY_INTERNAL_TOKEN, and the edge holds no bearer (EA3-1). Settings
#   reads env_file=".env" relative to the working directory, so a wrong
#   WorkingDirectory would load the root .env. With this line it cannot.
#   The path has no "-": the root .env is always on the box.
# - It also hides the other env files, the Git checkout, the SSH keys and
#   Copilot tokens of acb, the Docker socket and the user manager. Each of
#   those has a "-", so a box that lacks one still starts the unit.
# - No ReadWritePaths: the edge writes no file. ProtectSystem=strict makes
#   the venv read-only, which is why ExecStart runs the venv binary.
#
# The BH-7 drop-in installer in scripts/vps_apply.sh installs this file
# before the first restart of the apply. Fence:
# tests/unit/test_agent_edge_deploy.py.

[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=read-only
InaccessiblePaths=/opt/acb/app/.env
InaccessiblePaths=-/opt/acb/app/workbench/control_plane/.env.local -/opt/acb/app/workbench/operator_console/.env.local -/opt/acb/app/apps/services/customer_console/.env -/opt/acb/app/.git
InaccessiblePaths=-/home/acb/.ssh -/home/acb/.acb -/home/acb/.copilot -/home/acb/.cache/copilot -/home/acb/.cache/github-copilot-sdk
InaccessiblePaths=-/run/user -/run/docker.sock -/var/run/docker.sock -/etc/acb -/etc/sudoers.d
ProtectProc=invisible
RestrictSUIDSGID=yes
CapabilityBoundingSet=
AmbientCapabilities=
LockPersonality=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
