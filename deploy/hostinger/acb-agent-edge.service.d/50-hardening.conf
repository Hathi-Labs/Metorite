# WS-55 EA-10a — the systemd sandbox of the agent edge.
# Spec: project-docs/specs/external_agent_access.md §15.3 and §10.1 (other
# control 2). The shape is the BH-2 sandbox of acb-gateway
# (box_hardening.md §5 BH-2).
#
# The edge is a public door, and it holds the database DSN and the signing
# key. The unit runs as a DynamicUser (acb-agent-edge.service), so file
# permissions close every 0600 file of acb to it. This file is the second
# layer, for the paths that are not 0600:
#
# - InaccessiblePaths hides the root /opt/acb/app/.env, which holds
#   GATEWAY_INTERNAL_TOKEN. The edge holds no bearer (EA3-1). The path has
#   no "-": the root .env is always on the box. Its copies (.env.bak-*,
#   .env-edit.*) have no fixed name, and InaccessiblePaths takes no glob, so
#   the identity closes them, not this line.
# - It hides the workbench tree (its .env.local and the .env.local.bak.*
#   copies that vps_apply.sh writes), the Console env file, the Git
#   checkout, the gateway data (/opt/acb/app/data and the mem0 store under
#   /var/lib/acb-gateway), the Docker socket and the user manager. Each has
#   a "-", so a box that lacks one still starts the unit.
# - ProtectHome=yes: the edge needs nothing in /home. The venv interpreter
#   is the system python, not one under /home/acb (box_hardening.md).
# - No ReadWritePaths: the edge writes no file. ProtectSystem=strict makes
#   the venv read-only, which is why ExecStart runs the venv binary.
#
# ⚠️ WHAT THIS DOES NOT DO. The edge holds the DSN of the gateway's database
# role. Code execution in the edge reaches every table that role reaches.
# A narrower role for the edge is a follow-up before GA (spec §17).
#
# The BH-7 drop-in installer in scripts/vps_apply.sh installs this file
# before the first restart of the apply. bh2_strict_check reads the gateway
# only, not this unit. Fence: tests/unit/test_agent_edge_deploy.py.

[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
InaccessiblePaths=/opt/acb/app/.env
InaccessiblePaths=-/opt/acb/app/workbench -/opt/acb/app/apps/services/customer_console/.env -/opt/acb/app/.git
InaccessiblePaths=-/opt/acb/app/data -/var/lib/acb-gateway -/var/cache/acb-gateway
InaccessiblePaths=-/run/user -/run/docker.sock -/var/run/docker.sock -/etc/acb -/etc/sudoers.d
ProtectProc=invisible
RestrictSUIDSGID=yes
CapabilityBoundingSet=
AmbientCapabilities=
LockPersonality=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
