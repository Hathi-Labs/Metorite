# WS-49 BH-2 item 3 — the first sandbox lines for acb-operator-console.
# Spec: project-docs/specs/box_hardening.md §5 BH-2 and §2.3.
#
# This unit calls no sudo, so NoNewPrivileges costs it nothing. It closes P1
# for this unit: a child can no longer become root through sudo.
# Nothing more in this slice. BH-F3 (tests/unit/test_unit_hardening.py) fails
# if NoNewPrivileges=yes goes.
#
# The BH-7 drop-in installer in scripts/vps_apply.sh installs this file before
# the first service restart. It restarts the unit once, if no step of that
# deploy restarted it after the install.

[Service]
NoNewPrivileges=yes
PrivateTmp=yes
RestrictSUIDSGID=yes
