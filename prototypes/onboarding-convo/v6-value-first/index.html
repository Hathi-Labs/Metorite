<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aroh · Value first</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="stage-hero">
  <header class="topbar">
    <a class="brand" href="../index.html" aria-label="Back to the gallery">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="display brand-word">Aroh</span>
    </a>
    <div class="topbar-right">
      <a class="quiet-link" href="../index.html">All demos</a>
      <button class="quiet-link" id="restart" type="button">Restart</button>
      <span class="demo-tag">Demo</span>
    </div>
  </header>

  <!-- Stage 1: one question only -->
  <main class="hero" id="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="eyebrow">Before you sign up</p>
      <h1 class="display hero-title">Give me your business name.<br><em>I'll show you tomorrow morning.</em></h1>
      <p class="hero-sub">No form, no signup. I start from public facts, and you correct me.</p>
      <form class="hero-form" id="heroForm" autocomplete="off">
        <label class="sr-only" for="heroInput">Company website or name</label>
        <input id="heroInput" type="text" placeholder="Company website or name" required>
        <button class="btn" type="submit">Show me <span aria-hidden="true">→</span></button>
      </form>
      <p class="hero-try">Try <button type="button" class="chip" id="heroTry">kaveritextiles.in</button></p>
    </div>
  </main>

  <!-- Stage 2: the brief and the conversation -->
  <div class="workspace" id="workspace" hidden>
    <section class="chat" aria-label="Conversation with Aroh">
      <div class="chat-head">
        <span class="avatar" aria-hidden="true"></span>
        <div>
          <div class="chat-name">Aroh</div>
          <div class="chat-status" id="chatStatus">Reading public pages</div>
        </div>
        <button class="dock-toggle quiet-link" id="dockToggle" type="button" aria-expanded="true">Hide chat</button>
      </div>
      <div class="log" id="log" role="log" aria-live="polite"></div>
      <div class="composer" id="composer">
        <div class="chips" id="chips"></div>
        <form class="reply" id="replyForm" autocomplete="off">
          <label class="sr-only" for="replyInput">Your reply</label>
          <input id="replyInput" type="text" placeholder="Type a reply" disabled>
          <button class="send" type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </div>
    </section>

    <section class="canvas" id="canvas" aria-label="What Aroh understands">
      <div class="canvas-glow" aria-hidden="true"></div>
      <div class="canvas-inner" id="canvasInner"></div>
    </section>
  </div>

  <!-- Mock consent sheet -->
  <div class="scrim" id="scrim" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
