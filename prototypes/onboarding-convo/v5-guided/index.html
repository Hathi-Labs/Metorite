<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aroh · With Meera</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <a class="back" href="../index.html" aria-label="Back to all demos">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>All demos</span>
    </a>
    <div class="room" aria-label="People in this conversation">
      <ul class="people" id="people"></ul>
      <p class="room-label" id="roomLabel">Setting up Aroh</p>
    </div>
    <div class="corner">
      <span class="demo-tag">Demo</span>
      <button class="restart" id="restart" type="button" aria-label="Restart the demo">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M4 10a6 6 0 1 0 1.8-4.3M4 3.5v3h3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Restart</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="convo" aria-label="Conversation">
      <div class="thread" id="thread" aria-live="polite"></div>
      <div class="composer" id="composer">
        <div class="chips" id="chips"></div>
        <form class="inputbar" id="form" autocomplete="off">
          <label class="sr" for="input">Your reply</label>
          <input id="input" type="text" placeholder="Type a reply, or pick one above" disabled>
          <button class="send" type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M4 10h11M10.5 5 15.5 10l-5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </div>
    </section>

    <aside class="notes" id="notes" aria-label="Aroh's notes">
      <div class="notes-head">
        <span class="av av-aroh sm" aria-hidden="true"></span>
        <div>
          <h2>Aroh's notes</h2>
          <p class="notes-sub" id="notesSub">Aroh listens and writes down facts. Fix any of them.</p>
        </div>
        <span class="count" id="noteCount">0</span>
      </div>
      <ol class="note-list" id="noteList"></ol>
      <p class="notes-empty" id="notesEmpty">Nothing yet. Facts appear here as you talk.</p>
    </aside>
  </main>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<script src="app.js"></script>
</body>
</html>
