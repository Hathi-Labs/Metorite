<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aroh · Chat onboarding</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="intro">
  <div class="sky" aria-hidden="true"></div>

  <header class="bar">
    <a class="back" href="../index.html" aria-label="Back to all versions">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>All versions</span>
    </a>
    <div class="brand" aria-hidden="true"><span class="mark"></span>Aroh</div>
    <div class="corner">
      <span class="demo-tag">Demo</span>
      <button class="restart" type="button" id="restart" aria-label="Restart the conversation">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v2.8h2.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Restart</span>
      </button>
    </div>
  </header>

  <main class="scroller" id="scroller">
    <div class="column">
      <section class="hero" id="hero">
        <p class="hello">Good morning. I'm Aroh.</p>
        <h1 class="display hero-line">Tell me about your business.</h1>
        <p class="hero-sub">In your own words. I'll ask the rest.</p>
      </section>
      <ol class="thread" id="thread" aria-live="polite" aria-relevant="additions"></ol>
    </div>
  </main>

  <footer class="dock">
    <div class="column">
      <div class="chips" id="chips" role="group" aria-label="Suggested replies"></div>
      <form class="composer" id="composer" autocomplete="off">
        <label class="sr-only" for="input">Your reply</label>
        <input id="input" name="input" type="text" placeholder="Who you are, what you make…" enterkeyhint="send">
        <button class="send" type="submit" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="app.js"></script>
</body>
</html>
