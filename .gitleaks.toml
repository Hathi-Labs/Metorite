# gitleaks secret-scanning config (audit BO-8 / BO-18).
#
# Used by the pr-check `secret-scan` job (scans a PR's NEW commits) and by
# scripts/scan_secrets_history.sh (one-time full-history audit before/after the
# git filter-repo purge of the leaked Zoho token + DB dump).
#
# Extends gitleaks' built-in rule set; the allowlist below suppresses the
# DOCUMENTED dev placeholders and test fixtures so they don't produce false
# positives. Real leaked credentials are NOT allowlisted — they must be rotated
# and purged from history.

title = "Metorite gitleaks config"

[extend]
useDefault = true

# EA-19e (external_agent_access.md §10.9 question 3): a Metorite box token is
# `mbt_` and 43 URL-safe characters (256 bits, secrets.token_urlsafe(32)).
# The same shape as BOX_TOKEN_RE in packages/acb_common/acb_common/_log.py.
# ⚠️ The global allowlist below skips every path under tests/, so a test that
# proves this rule must scan a folder outside tests/ and build its sample at
# run time. Fence: tests/unit/test_box_token_secret_rules.py.
[[rules]]
id = "metorite-box-token"
description = "Metorite box token (mbt_ + 43 URL-safe characters)"
regex = '''mbt_[A-Za-z0-9_-]{43}'''
keywords = ["mbt_"]

[allowlist]
description = "Documented dev defaults + fixtures that are not real secrets"
paths = [
    '''(^|/)tests?/''',            # unit-test fixtures / mock tokens
    '''^evals/[^/]+/fixtures/''',  # synthetic eval data (WS-48 N2 mailbox: a fixture "key" field)
    '''\.env\.example$''',         # documented placeholder values
    '''package-lock\.json$''',
    '''uv\.lock$''',
    '''\.gitleaks\.toml$''',       # this file (the regexes below are literals)
]
regexes = [
    '''sk-local-dev-change-me''',  # documented LLM/internal dev default
    '''acb_dev_change_me''',       # documented dev Postgres password default
    '''change-me-dev-only''',      # documented dev session-secret default
    '''sk-local''',                # documented litellm_master_key dev default
    # WS-54 fix round 6: the ONE fake GitHub token that commit c58caf42d put in
    # workbench/control_plane/src/lib/setupTokens.test.ts as a literal. It is
    # a test sentinel, never a real token. A later commit builds the value at
    # run time, but a PR scan still reads the old commit, and history is not
    # rewritten (no force-push). The entry matches this exact value and no
    # other: never widen it.
    '''ghp_BFF_SENTINEL_0123456789abcdef''',
    # WS-66 PN-1: the PUBLIC VAPID key of the Google web-push codelab, used as
    # the applicationServerKey in src/lib/push.test.ts and
    # notificationsSection.test.ts. It is a public key that the codelab
    # publishes, never a key of ours (ours come through scripts/secrets.sh). A
    # PR scan reads the commits that hold it, so it must stay here. The entry
    # matches this exact value and no other: never widen it.
    '''BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U''',
]
