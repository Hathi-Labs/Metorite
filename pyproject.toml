# Root pyproject — uv workspace for the AI Company Brain monorepo.
# Apps + shared packages each live in their own sub-pyproject and are
# stitched together as a uv workspace so they share a single .venv + lockfile.

[project]
name = "project-docs"
version = "0.0.1"
description = "Fracktal Works internal multi-agent brain — mirror + reasoning + action layer over ClickUp/Zoho/Odoo."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Fracktal Works" }]
dependencies = [
    # Each member is brought in via the workspace; this top-level project is the umbrella.
    "acb-common",
    "acb-graph",
    "acb-llm",
    "acb-audit",
    "acb-skills",
    "acb-memory",
    "acb-auth",
    "gateway",
    "orchestrator",
    "ingestion",
    "reconciler",
    "action-broker",
    # WS-31 — the platform Customer Console. Same reason as the skill packages
    # below: the root test suite imports `customer_console`, so it must be installed
    # into the shared venv by `uv sync` or CI fails with ModuleNotFoundError.
    "customer-console",
    # Skill packages imported by the root test suite / evals — must be installed
    # into the shared venv by `uv sync` or CI fails with ModuleNotFoundError
    # (they resolve locally only because a dev venv already has them editable).
    "skill-task-gtd",
    "skill-clickup-sync",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
    "httpx>=0.27",
    "pre-commit>=4.0",
    "ipython>=8.29",
    # Complexity / maintainability gates (see § Complexity gate below).
    # radon = reporting (cc + mi); xenon = CI enforcement (fails past threshold).
    "radon>=6.0",
    "xenon>=0.9",
]

[tool.uv.workspace]
members = [
    "apps/services/*",
    "apps/agents/*",
    "apps/skills/*",
    "packages/*",
]
exclude = [
    # Non-Python services that live under apps/services/* but are not uv
    # workspace members (no pyproject.toml). The whatsmeow bridge is a Go module.
    "apps/services/whatsapp_bridge",
    # The meeting-bot worker is a standalone Dockerized service (Playwright +
    # headless Chrome); it pins its own deps in requirements.txt and is not part
    # of the uv workspace (kept off the main app's dependency graph).
    "apps/services/meeting_bot",
]

[tool.uv.sources]
acb-common    = { workspace = true }
acb-graph     = { workspace = true }
acb-llm       = { workspace = true }
acb-stt       = { workspace = true }
acb-audit     = { workspace = true }
acb-skills     = { workspace = true }
acb-memory     = { workspace = true }
acb-auth       = { workspace = true }
gateway        = { workspace = true }
orchestrator  = { workspace = true }
ingestion     = { workspace = true }
reconciler    = { workspace = true }
action-broker  = { workspace = true }
customer-console   = { workspace = true }
email-ingestion = { workspace = true }
whatsapp-ingestion = { workspace = true }
skill-task-gtd  = { workspace = true }
skill-clickup-sync = { workspace = true }

# ---------- Tooling config ----------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["workbench", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM", "RUF", "C90"]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # function-call-in-default-arg — FastAPI Depends() pattern
    "RUF006",  # asyncio-dangling-task — intentional fire-and-forget relays
]

[tool.ruff.lint.mccabe]
# Grandfather-and-ratchet: the repo has legacy functions up to cc=223
# (executor.run_agent_stream). This gate targets NEW code — 15 is a
# generous ceiling that current well-factored code clears. The ~108 legacy
# functions above 15 are tracked for refactor, not force-failed here; the
# CI job runs C90 as a diff-scoped report (see .github/workflows/pr-check.yml)
# and xenon owns the absolute grandfathered ceiling. Ratchet 15 → 12 → 10
# as the legacy tail is paid down.
max-complexity = 15

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
exclude = ["workbench/", "infra/", "build/", "dist/"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not integration'"
asyncio_mode = "auto"
testpaths = ["tests", "apps", "packages"]
markers = [
    "integration: requires docker-compose stack",
    "slow: long-running tests",
]
