[project]
name = "acb-auth"
version = "0.0.1"
description = "RBAC roles, user context, and FastAPI dependency helpers (WBS 1.7)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141",
    "acb-common",
    # Org access control resolves roles/overrides from Postgres (acb_auth.access).
    # Imported lazily so the pure permission model stays usable without a DB.
    "sqlalchemy>=2.1",
    # WS-31 CP-2b — `acb_auth.console_resolve` calls the Customer Console over
    # HTTP at sign-in. Declared HERE and not inherited from the gateway service
    # (which already has it): a package that is importable-but-broken anywhere
    # else is the same trap as depending on `customer-console` in the root venv
    # and discovering it only when the container is built.
    #
    # ⚠️ `customer-console` is deliberately NOT a dependency of this package and
    # must never become one — the capability decision is made Console-side and
    # only its RESULT crosses the wire (customer_console.md §6(d)). Fenced by
    # `tests/unit/test_console_dependency_boundary.py`.
    "httpx>=0.27",
    # MCP-P1a (external_agent_access.md §19.7, AD-14): branch 0 writes one
    # audit row for each call of the app door, through `acb_audit.record`. The
    # import is lazy, inside `deps._audit_door`, and a failed write never
    # refuses the call. Declared here, so the package does not rely on the
    # gateway to bring it.
    "acb-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acb_auth"]

