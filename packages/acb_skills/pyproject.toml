[project]
name = "acb-skills"
version = "0.0.1"
description = "Read-side skill registry: walks the skills/ tree, parses SKILL.md, returns typed records."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "ddgs>=9.16",
    # Workspace members this package imports. `acb_common` is imported at
    # module level by several tools. `acb_llm` is the `decide` tool's facade
    # (WS-31 CP-13d). Declared HERE, or the import is green in the root venv
    # and broken in an image whose closure lacks them. None of them imports
    # acb_skills, so there is no cycle.
    "acb-common",
    "acb-llm",
    # The sandbox tools (WS-43d) build on MAF's file tools and skills
    # provider: `tenant_file_store.py` and `sandbox_tools.py`. The same pin
    # the orchestrator declares.
    "agent-framework-core>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acb_skills"]
