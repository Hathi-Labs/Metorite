[project]
name = "acb-skills"
version = "0.0.1"
description = "Read-side skill registry: walks the skills/ tree, parses SKILL.md, returns typed records."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "ddgs>=9.16",
    # Workspace members this package imports. `acb_common` is imported at
    # module level by several tools. `acb_llm` is the `decide` tool's facade
    # (WS-31 CP-13d). Declared HERE, or the import is green in the root venv
    # and broken in an image whose closure lacks them. None of them imports
    # acb_skills, so there is no cycle.
    "acb-common",
    "acb-llm",
    # The sandbox tools (WS-43d) build on MAF's file tools and skills
    # provider: `tenant_file_store.py` and `sandbox_tools.py`. The same pin
    # the orchestrator declares.
    "agent-framework-core>=1.19.0",
    # read_attachment (H-229) parses a chat PDF. pypdf is pure Python, and
    # each parse switches off its one subprocess (jbig2dec).
    "pypdf>=6.19",
    # agent_site.py (WS-49 BH-7) reads an agent's requirement lines, their
    # version specifiers and their markers, against the venv.
    "packaging>=24",
    # attachment_ocr.py (WS-67 OA-3, D116) reads the text of a scanned PDF
    # or an image. Only the child of `attachment_ocr_worker.py` imports these,
    # never the gateway process. Each pin is exact and was at least two weeks
    # old at the pin. Each license is permissive: rapidocr Apache-2.0 (models
    # Apache-2.0), onnxruntime MIT, pypdfium2 Apache-2.0 / BSD-3-Clause,
    # Pillow MIT-CMU. rapidocr brings opencv-python-headless (Apache-2.0),
    # which needs no system library. Its wheel bundles FFmpeg as a shared
    # library under LGPL-2.1 (cv2/LICENSE-3RD-PARTY.txt). The OCR child never
    # calls the video code.
    "rapidocr==3.10.0",
    "onnxruntime==1.30.0",
    "pypdfium2==5.14.0",
    "pillow==12.3.0",
    # fetch_page (WS-WEB WEB-2, web_research.md §3.2) reads the main text of
    # an HTML page with Trafilatura (Apache-2.0). The pin is exact, as above.
    # It brings courlan, htmldate, justext, lxml-html-clean, dateparser,
    # babel and tld. We take tld under MPL-1.1. No package of this closure
    # is AGPL. Fence: tests/unit/test_no_agpl_dependency.py.
    "trafilatura==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acb_skills"]
