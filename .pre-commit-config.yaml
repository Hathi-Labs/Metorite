# Pre-commit hooks for Metorite.
#
# Grandfather-and-ratchet philosophy: every hook here is diff-scoped —
# pre-commit only runs against STAGED files, so legacy code is never
# force-touched. New and edited code must pass; the ~250 not-yet-formatted
# and ~37 over-complex legacy files are paid down incrementally, not in a
# big-bang rewrite.
#
# Setup (once per clone):   uv run pre-commit install
# Run manually on a diff:   uv run pre-commit run
# Run on the whole repo:    uv run pre-commit run --all-files   (opt-in only)
#
# Scope note: Python, plus markdown for the STE writing rules at the bottom of
# this file. The workbench/ (Next.js) and infra/ trees are excluded here and
# gated by their own eslint config / CI.

exclude: '^(workbench/|infra/|__pycache__/|.*\.egg-info/)'

repos:
  # --- Ruff: lint + format, pinned to match the dev dependency ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      # Lint (incl. C901 complexity at max-complexity=15 from pyproject).
      # --fix auto-repairs the safe ones; anything left blocks the commit.
      - id: ruff
        args: [--fix]
      # Format staged files only. Does NOT reformat the whole repo —
      # legacy files reformat organically the next time they're touched.
      - id: ruff-format

  # --- mypy: strict type check (config in pyproject [tool.mypy]) ---
  # Diff-scoped and non-blocking-in-CI initially (see pr-check.yml), but
  # locally it surfaces type errors on the code you're actually changing.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        # Use the project's own resolution rather than the isolated hook env,
        # so workspace packages + stubs are visible.
        #
        # `pass_filenames` MUST stay true. It was false, and with no `args:`
        # that gave mypy no target at all: every commit died on
        # "Missing target module, package, files, or command." — so this hook
        # has never once type-checked anything (H-28).
        #
        # ⚠️ REPORT-ONLY, and deliberately so. `mypy` is `strict = true` over a
        # tree that has never been swept: 1508 errors in 271 files, measured
        # 2026-08-28. A BLOCKING diff-scoped hook would stop a commit on
        # somebody else's 30 pre-existing errors in the file you touched, and
        # the only thing that teaches is `--no-verify`. A hook people bypass is
        # worse than one that reports, because the bypass becomes the habit.
        #
        # This matches the ratchet the CI step already states: report now, flip
        # to blocking once the sweep lands. Flipping it early is not a
        # tightening — it is how the ratchet gets abandoned.
        pass_filenames: true
        entry: bash -c 'uv run mypy "$@" || true' --
        verbose: true
        language: system
        types: [python]
        # pyproject's [tool.mypy] `exclude` does NOT apply to paths passed
        # explicitly on the command line, so the same exclusions live here.
        exclude: ^(workbench|infra|build|dist)/

  # --- Hygiene: strip the UTF-8 BOMs that break radon/xenon/other parsers ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # --- STE: Simplified Technical English, on the lines you ADDED ---
  # Contract: docs/style_ste.md. Word list: .claude/hooks/ste-words.json.
  # The same grandfather-and-ratchet rule as everything above, and here it is
  # load-bearing: measured 2026-08-26, 196 markdown files carry 19094 errors.
  # A whole-file gate would fail every edit to work_plan.md and be deleted within
  # a week, so --staged reads ADDED LINES ONLY.
  # Fence for the fence: node .claude/hooks/ste-lint.test.mjs
  - repo: local
    hooks:
      - id: ste-lint
        name: ste-lint (Simplified Technical English, added lines only)
        entry: node .claude/hooks/ste-lint.mjs --staged
        language: system
        pass_filenames: false
        files: \.mdx?$
