[project]
name = "agent-task-manager"
version = "0.1.0"
description = "Task management MAF agent (My Tasks over the one task store)"
requires-python = ">=3.12"
dependencies = [
    "acb-common",
    "acb-llm",
    # Native MAF chat client → gateway /v1 (agent_framework Agent +
    # OpenAIChatCompletionClient). Not the GitHub Copilot SDK since 2026-10-03.
    "agent-framework-core>=1.19.0",
    "agent-framework-openai>=1.14.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []