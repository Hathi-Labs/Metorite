[project]
name = "agent-org-admin"
version = "0.1.0"
description = "Organization Members - the owner of the org-admin tool pack: the members, their roles and status, and the sign-in requests"
requires-python = ">=3.11"
dependencies = [
    "acb-common",
    "acb-skills",
    "agent-framework-core>=1.19.0",
    "agent-framework-openai>=1.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
