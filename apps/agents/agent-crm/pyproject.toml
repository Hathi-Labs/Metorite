[project]
name = "agent-crm"
version = "0.1.0"
description = "CRM Assistant agent — search, pipeline, record and timeline reads over the native CRM, plus confirmation-gated lead/deal/activity writes"
requires-python = ">=3.11"
dependencies = [
    "acb-common",
    "acb-skills",
    "agent-framework-core>=1.19.0",
    # Native MAF chat client → LiteLLM gateway /v1 (the agent uses agent_framework
    # Agent + OpenAIChatCompletionClient instead of the GitHub Copilot SDK).
    "agent-framework-openai>=1.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
