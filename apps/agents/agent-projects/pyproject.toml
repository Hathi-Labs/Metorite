[project]
name = "agent-projects"
version = "0.1.0"
description = "Projects assistant agent (projects-assistant): the AI chat inside the Projects app, over the skill-projects tool family"
requires-python = ">=3.11"
dependencies = [
    "acb-common",
    "acb-skills",
    "skill-projects",
    "agent-framework-core>=1.19.0",
    "agent-framework-openai>=1.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
