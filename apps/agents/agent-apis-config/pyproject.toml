[project]
name = "agent-apis-config"
version = "0.1.0"
description = "API Configuration Assistant MAF agent"
requires-python = ">=3.12"
dependencies = [
    "acb-common",
    "acb-llm",
    # Native MAF chat client → gateway /v1 (agent_framework Agent +
    # OpenAIChatCompletionClient). Not the GitHub Copilot SDK since 2026-10-03.
    "agent-framework-core>=1.19.0",
    "agent-framework-openai>=1.14.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
