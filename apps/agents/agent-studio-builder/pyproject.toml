[project]
name = "agent-studio-builder"
version = "0.1.0"
description = "Studio Builder - the owner of the studio tool pack: draft, patch, validate and outline an AI Studio app manifest"
requires-python = ">=3.11"
dependencies = [
    "acb-common",
    "acb-skills",
    "agent-framework-core>=1.19.0",
    "agent-framework-openai>=1.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
