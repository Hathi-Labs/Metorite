[project]
name = "agent-settings-keeper"
version = "0.1.0"
description = "Settings Keeper - the owner of the settings tool pack: read and change the member's settings from the chat"
requires-python = ">=3.11"
dependencies = [
    "acb-common",
    "acb-skills",
    "agent-framework-core>=1.19.0",
    "agent-framework-openai>=1.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
