[project]
name = "gateway"
version = "0.0.1"
description = "FastAPI + Google SSO. Pull queries, push notifications, approvals."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    # WebSocket CLIENT for the WhatsApp call-audio proxy (transport/calls_audio.py).
    # uvicorn[standard] already pulls this in for the SERVER side, but relying on
    # that would make duplex call audio break on a transitive-dependency change,
    # and only at the moment someone tries to speak.
    "websockets>=12",
    # AG-UI streaming endpoint (replaces copilot_chat.py SSE path — WBS 0.7)
    "agent-framework-ag-ui>=1.4.0",
    "acb-common",
    "acb-llm",
    "acb-stt",
    "acb-auth",
    "orchestrator",
    "email-ingestion",
    "whatsapp-ingestion",
    # Provider webhook receivers + the ingestion event-bus consumer the lifespan
    # starts (ingestion/consumer.py, §BO-20a). It resolved only via the root
    # workspace umbrella before, which is why the event-sink registration is
    # wrapped in a try/except ("ingestion optional in some deploys").
    "ingestion",
    "action-broker",
    # Résumé ingestion (Task Manager HR): PDF + DOCX text extraction.
    "pymupdf>=1.24",
    "python-docx>=1.1",
    # WS-27bm S8 — Markdown to HTML for the one PDF seam (gateway/pdf_render.py).
    # It was already in uv.lock through `rich`; this line makes it a direct
    # dependency, so the PDF route does not rest on another package's choice.
    "markdown-it-py>=3",
    # Workflow schedule triggers: cron parsing only (CronTrigger), no
    # scheduler process — see routes/workflows/scheduler.py.
    "apscheduler>=3.10,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
