[project]
name = "agent-edge"
version = "0.0.1"
description = "The public edge for outside agents: OAuth metadata, token and revoke (WS-55 EA-2a). EA-3 adds /mcp."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    # The token store (`acb_auth.agent_tokens`) and the shared OAuth rules
    # (`acb_auth.agent_oauth`). The edge never imports the gateway.
    "acb-auth",
    "acb-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_edge"]
