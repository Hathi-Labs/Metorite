[project]
name = "skill-projects"
version = "0.1.0"
description = "The Projects tool family for the projects-assistant agent: reads, confirmation-gated writes and the route manifest, over the gateway /projects API"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "acb-common"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_projects"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
