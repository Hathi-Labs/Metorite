[project]
name = "skill-my-tasks"
version = "0.1.0"
description = "The My Tasks tools for agent-task-manager (capture/clarify/organize over the gateway lens routes)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "acb-common"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_my_tasks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
