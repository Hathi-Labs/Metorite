[project]
name = "tally-bridge"
version = "0.1.0"
description = "An MCP server that reads TallyPrime on the same machine, for Metorite."
requires-python = ">=3.12"
# Not a uv workspace member: the program ships to the customer's machine with
# its own bundled Python, and imports nothing from apps/services or packages/.
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.28,<1",
    "defusedxml>=0.7,<1",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "cryptography>=42",
    # TLY-5 PR B: the Windows service. Windows only.
    "pywin32>=306; sys_platform == 'win32'",
]

# TLY-5: the installer build (installer/build.ps1) runs from this locked
# group, so the shipped program holds the versions that the tests ran.
[dependency-groups]
build = ["pyinstaller>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tally_bridge"]
